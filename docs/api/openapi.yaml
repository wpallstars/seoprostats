  /clicks:
    get:
      operationId: getClicks
      summary: Clicks and form submits (autocapture), with totals.
      description: |
        Totals of the period, and rows of one `kind`: clicked elements (by
        selector and label, with their dead clicks), dead clicks only, link
        destinations, file links, or forms sent (by name, selector and
        destination), or pages grouped by path with clicks, dead-click rate,
        link clicks, forms sent and visits. Sorted by count. `page` keeps clicks on that page;
        filters select the visits, and a page filter also keeps clicks on
        that page. Clicks are kept 3 months by default (Settings → Data),
        so older ranges are empty. Never carries what anyone typed.
      parameters:
        - name: kind
          in: query
          schema:
            type: string
            enum: [elements, dead, links, downloads, forms, pages]
            default: elements
        - name: page
          in: query
          description: A path; `*` is any text.
          schema:
            type: string
            examples: [/pricing/]
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/compare'
        - $ref: '#/components/parameters/filters'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: Totals and rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClicksAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
