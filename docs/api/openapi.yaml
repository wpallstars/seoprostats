        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'
  /search:
    get:
      operationId: getSearch
      summary: Search clicks, impressions, CTR and position from Google or Bing, with rows.
      description: |
        Search data imported from Google Search Console or Bing Webmaster
        Tools (`/connections`), one `engine` at a time: totals of the
        period, a point per day (per month past 120 days), and rows of
        one `kind`: search queries, pages, countries or devices, sorted
        by clicks. `page` keeps the searches that showed that page (its
        queries), `query` keeps one query (its pages); countries and
        devices exist for the whole site only, so with either they are
        empty.

        Bing gives its pages and queries by week, and no countries or
        devices: the period is widened at its start to the whole weeks its
        days fall in (cut instead before the first day with data), a page's
        or query's points are by week (`grain` `week`), and a day's
        position is its week's.

        Search days are the engine's own (Pacific time for Google, UTC
        for Bing) and final only, so the newest is about three days old
        (Bing: the end of its newest week, a week or more). The period is
        cut at the newest day with search data (`through`), and the
        comparison has the same number of days, so days not imported yet
        never look like a drop. Page filters apply like `page`; other
        filters select visits, which search data has not, and are listed
        in `ignored`.

        CTR is clicks ÷ impressions. Position is the average of the
        highest place a page held each time it was shown, weighted by
        impressions; lower is better, and 0 means no impressions.
        Both engines leave out rare searches, so rows add up to less
        than the totals. Demo data has made-up search days for both.
      parameters:
        - $ref: '#/components/parameters/engine'
        - name: kind
          in: query
          schema:
            type: string
            enum: [queries, pages, countries, devices]
            default: queries
        - name: page
          in: query
          description: A path; `*` is any text.
          schema:
            type: string
            examples: [/pricing/]
        - name: query
          in: query
          description: A search query; `*` is any text.
          schema:
            type: string
            examples: [core web vitals]
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/compare'
        - $ref: '#/components/parameters/filters'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: Totals, points and rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /opportunities:
    get:
      operationId: getOpportunities
      summary: Where search effort pays — striking-distance queries, low-CTR queries, pages losing clicks, queries missing from their page or queries shared by pages.
      description: |
        From the same imported search days as `/search` (one `engine`),
        one `kind` of opportunity, best first:

        - `striking`: a page's query at average position 4–20 with
          enough impressions (`rules.min_impressions`, scaled by the
          period's days). `potential` is the clicks it could gain at the
          site's own CTR at position 3: impressions × (that CTR − its
          CTR).
        - `ctr`: a page's query in the top 10 whose CTR is under
          `rules.under` × the site's own CTR at its position (title and
          description work). `potential` is the clicks it misses:
          impressions × expected CTR − clicks.
        - `decay`: pages with at least `rules.min_share` fewer clicks,
          and `rules.min_lost` or more, than in the earlier period of the
          same length (the previous one; a year earlier with
          `compare=year`). Each has a likely `cause`: `gone` (no
          impressions now), `position` (ranks lower by a place and a
          tenth or more), else whichever fell more of `demand`
          (impressions) and `ctr`; a sentence (`why`), the queries that
          lost most, and the site's recorded changes on the page in both
          periods. `updates` lists search engine updates in either.
        - `missing`: a page's query in the top 20 with enough impressions
          whose words the page does not have (`none`), or has only some
          of (`partial`), as `/coverage` checks them; most impressions
          first. Only the `rules.pages` pages with most impressions are
          read, and only pages that are one post (or a demo page).
        - `overlap`: a query for which two or more pages each get at
          least `rules.min_share` of the impressions of its pages (with
          `rules.min_impressions` or more in all), from the 2,000
          page-query pairs with most impressions. A candidate to review,
          not a fault: two pages can both be right for one search. The row
          is the leading page's (most impressions), with the query's
          figures over all its pages; `pages` lists up to `rules.pages`
          with their figures and `share`; `leaders` is the leading page in
          each half of the period (`halves`) and `switched` whether it
          changed; `potential` is the clicks the query would have if all
          its pages' impressions had the best of their CTRs. Most
          impressions on pages other than the leading one first.

        Expected CTR is the site's own in the period: clicks ÷
        impressions by rounded position (1–20), made never to rise with
        position; positions with too few impressions use a cautious
        default (`curve.source`).

        As `/search`, the period is cut at the newest search day; it is
        also cut to its newest 91 days (`days`, `cut`), so a long period
        never reads every query of every day. Page filters apply; other
        filters are listed in `ignored`.
      parameters:
        - $ref: '#/components/parameters/engine'
        - name: kind
          in: query
          schema:
            type: string
            enum: [striking, ctr, decay, missing, overlap]
            default: striking
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/compare'
        - $ref: '#/components/parameters/filters'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: Opportunities of one kind.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunitiesAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /audit:
    get:
      operationId: getAudit
      summary: The content audit — published pages with findings from their content and SEO plugin fields, most search impressions first.
      description: |
        Facts read from WordPress about each published post: the title
        shown (the SEO plugin's, else the post's), the description (the
        SEO plugin's, else the excerpt), H1s in the text, words, images and
        those without alt text, and whether the SEO plugin sets noindex or
        a canonical address on another page. Facts are read when a post is
        saved and by the daily cron (`rules.batch` posts a run, each again
        after `rules.stale_days` days), never on visitor pages; `checked`
        says how many pages have facts and when they were read.

        Findings, most serious first (`AuditFinding`): `noindex` and
        `canonical` (only on pages with impressions), `thin` (under
        `rules.thin_words` words with `rules.thin_impressions` or more
        impressions and no clicks), `title_missing`, `title_duplicate`,
        `title_long` (over `rules.title_max` characters),
        `description_missing`, `description_duplicate`,
        `description_long` (over `rules.description_max`), `h1_none`,
        `h1_several` (themes show the title as an H1, so one in the text
        makes several) and `images_alt`. Lengths are of what was written:
        an SEO title made of its plugin's variables counts as the post's.

        Pages are listed most impressions first, with their search figures
        from the same imported days as `/search` (one `engine`; cut as
        `/opportunities` is). `counts` gives pages per finding whatever
        `finding` is asked for. Each finding also becomes a `/queue` item.
        Page filters apply; other filters are listed in `ignored`.
      parameters:
        - $ref: '#/components/parameters/engine'
        - name: finding
          in: query
          description: Only pages with this finding; all when left out.
          schema:
            $ref: '#/components/schemas/AuditFinding'
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/filters'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: Pages with findings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /links:
    get:
      operationId: getLinks
      summary: Internal links — orphan pages, converting pages with few links in, and links missing between pages that share a search.
      description: |
        Links in the text of published pages to the site's own pages,
        read with the content audit's facts (when a post is saved and by
        the daily cron, never on visitor pages); menus and widgets are not
        read. `read` says how many published pages had their links read.
        Links to WordPress's folders, feeds and files are left out.

        - `orphans`: published pages no other page links to, most search
          impressions first.
        - `converting`: pages whose visits from search reached `goal`
          `rules.min_conversions` times or more with `rules.few_links` or
          fewer pages linking to them, most conversions first.

        The front page is in neither list, as menus link to it.
        - `missing`: a page with `rules.min_impressions` or more
          impressions on a search does not link to the search's page with
          most clicks; one row per page and page it should link to, with
          up to `rules.queries` searches, most impressions first. Read
          from the 2,000 page and query pairs with most impressions, as
          `/opportunities`.

        Search figures come from the same imported days as `/search` (one
        `engine`; cut as `/opportunities` is). `counts` gives every list's
        rows whatever `kind` is asked for. Each row also becomes a
        `/queue` item. Page filters apply; other filters are listed in
        `ignored`.
      parameters:
        - $ref: '#/components/parameters/engine'
        - name: kind
          in: query
          description: Which list.
          schema:
            $ref: '#/components/schemas/LinksKind'
        - name: goal
          in: query
          description: ID of the goal whose conversions are counted; the first goal when left out.
          schema:
            type: string
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/filters'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: One list of internal links.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinksAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /coverage:
    get:
      operationId: getCoverage
      summary: Query coverage of one page — its search queries, which its words do not cover, questions and focus keywords.
      description: |
        The Search Console queries one page showed for (most impressions
        first, up to 200), each checked against the page's own words: its
        terms are its words without common short words, lightly stemmed
        (plural s). `match` is `title` when every term is in the post
        title or SEO title, `heading` when every term is in the headings,
        `text` when every term is anywhere on the page (text, excerpt,
        image alt text, SEO description), `partial` when some are, else
        `none`; `missing` lists the words the page lacks and `phrase`
        whether the words are there in order. `question` marks queries
        that start with a question word or hold a question mark.

        `focus` lists the focus keywords of Rank Math, Yoast SEO,
        SEOPress or All in One SEO when one is active (others can add
        theirs with the `seoprostats_focus_keywords` filter), with their
        search figures when they are queries of the page. Without an SEO
        plugin `focus` is empty and the rest is the same.

        Give the page as `page` (a path) or `post` (a post ID: its
        address). Only one page's queries are read, by the `path_day`
        key; its post is read once. As `/opportunities`, the period is
        cut at the newest search day and to its newest 91 days.
      parameters:
        - name: page
          in: query
          description: The page, a path such as /pricing/.
          schema:
            type: string
        - name: post
          in: query
          description: The post whose address is the page.
          schema:
            type: integer
            minimum: 0
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: The page's queries and how its words cover them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /content:
    get:
      operationId: getContent
      summary: Content performance — each page's search clicks with its visits from search and their conversions.
      description: |
        Per page, the search engine's clicks, impressions, CTR and
        position (`engine`: Google or Bing) beside the visits from
        organic search (any engine) that
        started on the page, with their bounce rate, views per visit and
        time, and how many of those visits reached a goal: `goal`, or the
        first goal when left out (`conversions` is null without goals).
        A page with clicks but no visits, or visits but no clicks, is
        listed too.

        Every read uses an index and none grows with all the visits:
        the search tables by their keys, the daily summaries of search
        landings, and the goal's hits joined to their visits. Days
        summarised before search landings existed are filled in, newest
        first, a few minutes after an update; until then `partial` is
        true and `landings_from` is the oldest day counted.

        As `/search`, the period is cut at the newest search day and
        the comparison has as many days. Page filters apply; other
        filters are listed in `ignored`.
      parameters:
        - $ref: '#/components/parameters/engine'
        - name: sort
          in: query
          description: Order of the pages, most first.
          schema:
            type: string
            enum: [clicks, visits, conversions]
            default: clicks
        - name: goal
          in: query
          description: ID of the goal whose conversions are counted; the first goal when left out.
          schema:
            type: string
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/compare'
        - $ref: '#/components/parameters/filters'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: Totals and pages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /demo:
    get:
      operationId: getDemo
      summary: Whether the demo data is made, and which data set the signed-in person sees.
      responses:
        '200':
          description: Status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoStatus'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: makeDemo
      summary: Make the demo data, or carry on making it.
      description: |
        Needs manage_options. Starts when there is no demo data (or with
        `restart`), then each call does up to ten seconds of work: call
        again until `status` is `ready`. Live statistics are not touched.
        While it is shown, demo data is topped up to the present, so today
        and realtime have visits.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                days:
                  type: integer
                  minimum: 1
                  maximum: 800
                  default: 400
                  description: Days of visits back from today.
                restart:
                  type: boolean
                  default: false
                  description: Remove the demo data and make it again.
      responses:
        '200':
          description: Status after this slice of work.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoStatus'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      operationId: removeDemo
      summary: Remove the demo data (its tables). Needs manage_options; live statistics are not touched.
      responses:
        '200':
          description: Status (none).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoStatus'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'

  /view:
    post:
      operationId: setView
      summary: Save the data set the signed-in person sees on the screens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: string
                  enum: [live, demo]
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: string
                    enum: [live, demo]
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'

  /connections:
    get:
      operationId: listConnections
      summary: Every outside data source's status. Needs the right to change the settings; never returns credentials.
      responses:
        '200':
          description: Statuses.
          content:
            application/json:
              schema:
                type: object
                required: [sources]
                properties:
                  sources:
                    type: array
                    items:
                      $ref: '#/components/schemas/Connection'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'

  /connections/{source}:
    parameters:
      - $ref: '#/components/parameters/source'
    get:
      operationId: getConnection
      summary: One source's status.
      responses:
        '200':
          description: Status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UnknownSource'
    post:
      operationId: connect
      summary: Connect a source, or change its property or key.
      description: |
        Search Console: signs in with the service account's key and lists
        the properties it can read before anything is stored. The key is
        stored encrypted and never returned. The import starts in WP-Cron a
        few seconds later: the 16 months Search Console keeps, newest
        first, then each day once Search Console marks it final. Another
        property starts the import again from the beginning.

        Bing Webmaster Tools: checks the API key (Bing Webmaster Tools →
        Settings → API access) by listing its verified sites before
        anything is stored. The import is the same: the 16 months Bing
        keeps, then each week once Bing gives it, then each top page's
        queries.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                  description: Search Console, the service account's JSON key, as text; Bing, the API key. Without it, the saved key is kept (to change the property or site).
                property:
                  type: string
                  description: The property (Search Console) or verified site (Bing) to import. Without it, the one for this site's address (Search Console, a domain property before an address one).
                  examples: ['sc-domain:example.com', 'https://example.com/']
      responses:
        '200':
          description: Connected; its status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '400':
          description: |
            The key cannot be read, Google or Bing refused it, or it cannot
            read the property or site. When a property or site is the
            problem, `data.properties` lists the ones it can read and (Search
            Console) `data.account` is its address, to add in Search Console.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UnknownSource'
    delete:
      operationId: disconnect
      summary: Disconnect a source (forget its credentials); its imported data stays unless delete_data is true.
      parameters:
        - name: delete_data
          in: query
          description: Also delete the data imported from it, and its import history.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Disconnected; its status, with the rows deleted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Connection'
                  - type: object
                    required: [deleted]
                    properties:
                      deleted:
                        type: integer
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UnknownSource'

  /connections/{source}/import:
    parameters:
      - $ref: '#/components/parameters/source'
    post:
      operationId: importNow
      summary: Import now, for up to 20 seconds; while history remains, the job carries on in WP-Cron a minute apart.
      responses:
        '200':
          description: What this run did, and the status after it.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Connection'
                  - type: object
                    required: [run]
                    properties:
                      run:
                        type: object
                        required: [days, rows, import, done]
                        properties:
                          days:
                            type: integer
                          rows:
                            type: integer
                          pages:
                            type: integer
                            description: Bing, pages whose queries were imported in this run.
                          import:
                            type: integer
                            description: The imports row it wrote (0 when there was nothing new).
                          done:
                            type: boolean
                            description: Every final day is in.
        '400':
          description: The source is not connected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UnknownSource'
        '409':
          description: Another import is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: The source answered with an error (the message is its own); the job tries again later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /imports/{id}:
    delete:
      operationId: undoImport
      summary: Undo an import, deleting the rows it wrote.
      description: |
        The job does not import those days again; `wp seoprostats
        search-console reimport --from=… --to=…` (or `bing reimport`)
        does. Undoing an import
        already undone deletes nothing.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Undone.
          content:
            application/json:
              schema:
                type: object
                required: [id, deleted]
                properties:
                  id:
                    type: integer
                  deleted:
                    type: integer
                    description: Rows deleted.
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: There is no import with that ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    applicationPassword:
      type: http
      scheme: basic
      description: WordPress username and an Application Password.
    cookieNonce:
      type: apiKey
      in: header
      name: X-WP-Nonce
      description: The logged-in cookie with a wp_rest nonce (the dashboard).

  parameters:
    range:
      name: range
      in: query
      description: |
        Period in the site time zone. realtime: the last 30 minutes. 24h:
        the last 24 whole hours and the current one. 7d, 30d, 90d: that many
        days including today. week (from the site's first day of the week),
        month, year: so far. 12mo: a year back from tomorrow. lastyear: the
        previous calendar year. all: since the first visit. custom: from and
        to.
      schema:
        type: string
        enum: [realtime, today, yesterday, 24h, 7d, 30d, 90d, week, month, year, 12mo, lastyear, all, custom]
        default: 7d
    from:
      name: from
      in: query
      description: First day of a custom range.
      schema:
        type: string
        format: date
    to:
      name: to
      in: query
      description: Last day of a custom range (included).
      schema:
        type: string
        format: date
    compare:
      name: compare
      in: query
      description: |
        prev: the same number of days just before (24h and realtime: the
        same length). year: the same dates a year before. A range that ends
        in the future is compared with the same length of the other period,
        so a partial day meets a partial day.
      schema:
        type: string
        enum: [none, prev, year]
        default: none
    filters:
      name: filters
      in: query
      description: |
        Every filter must match (AND). Each is
        `dimension:operator:value`, where a comma means any of (OR) and `\,`
        is a comma in a value; `dimension:value` means `is`. Repeat the
        parameter as `filters[]=` for several, or send a JSON list of
        `{dimension, op, values}`. Operators: is, is_not, contains (anywhere,
        case-insensitive per the database collation), matches (glob: `*` is
        any text). An empty value is "none" (for source: direct). Channel
        and device take their names (organic_search, mobile); country takes
        ISO codes. Page and event filters select visits that viewed the
        page or had the event; with a page filter, pageviews count only
        that page's views.
      style: form
      explode: true
      schema:
        oneOf:
          - type: string
            examples: ['channel:is:organic_search,ai']
          - type: array
            items:
              type: string
            examples: [['page:matches:/blog/*', 'country:is_not:US']]
    data:
      name: data
      in: query
      description: live (the site's statistics) or demo (the demo data, once made).
      schema:
        type: string
        enum: [live, demo]
        default: live
    engine:
      name: engine
      in: query
      description: |
        Search engine: google (Search Console) or bing (Bing Webmaster
        Tools). Bing gives no devices or countries, and its pages and
        queries by week: the period is widened at its start to whole weeks,
        and a page's or query's points are by week.
      schema:
        type: string
        enum: [google, bing]
        default: google
    changePage:
      name: page
      in: query
      description: Only changes to this page (a path; `*` is any text), and the site-wide ones (plugins, themes, settings), which affect every page.
      schema:
        type: string
        examples: [/pricing/]
    changeKinds:
      name: kinds
      in: query
      description: |
        Only these kinds or groups of change, comma-separated. Groups:
        content, seo, product, site, search, note. Kinds: published,
        unpublished, address, title, content, links, external_links;
        seo_title, meta_description, robots, canonical; out_of_stock,
        back_in_stock, price_up, price_down, sale_started, sale_ended,
        coupon_published, coupon_changed, coupon_removed; plugin_installed,
        plugin_updated, plugin_activated, plugin_deactivated,
        plugin_deleted, theme_switched, theme_updated, core_updated,
        search_visibility, permalinks, site_address, front_page;
        search_update (search engine updates, when switched on under
        Settings → Data); note, experiment (an experiment's start; see
        /experiments).
      schema:
        type: string
        examples: [product, 'plugin_updated,core_updated', search]
    id:
      name: id
      in: path
      required: true
      description: A goal's or funnel's id (lower-case letters and digits).
      schema:
        type: string
        pattern: '^[a-z0-9]+$'
    source:
      name: source
      in: path
      required: true
      description: An outside data source.
      schema:
        type: string
        enum: [search-console, bing]

  responses:
    BadDefinition:
      description: A field is missing or too long, a funnel has too few or too many steps, or the data set already has the most goals or funnels it may.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: There is no such goal, funnel, note, experiment or change in this data set (or, with data=demo, no demo data).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Deleted:
      description: Deleted.
      content:
        application/json:
          schema:
            type: object
            required: [deleted, id]
            properties:
              deleted:
                type: boolean
              id:
                type: [string, integer]
                description: A goal's or funnel's id (a string), or a note's or experiment's (an integer).
    NoDemo:
      description: data=demo, and there is no demo data yet (POST /demo makes it).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: A parameter cannot be read; the message says how to write it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Not logged in, or without view_seoprostats.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnknownSource:
      description: There is no such data source.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    ShareInput:
      type: object
      description: Administrator share fields. Creation needs views; updates merge omitted fields with the current share. Secrets never appear in list/update responses.
      properties:
        name: {type: string, maxLength: 190}
        note: {type: string, maxLength: 2000}
        password: {type: string, maxLength: 256}
        views:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            description: Saved ViewState; valid section choices are normalized as the dashboard address reader normalizes them.
            required: [view]
            properties:
              view: {type: string, enum: [overview, goals, clicks]}
              range: {type: string, default: '30d'}
              from: {type: string, format: date}
              to: {type: string, format: date}
              compare: {type: string, enum: [none, prev, year], default: prev}
              metric: {type: string, default: visitors}
              filters: {type: array, maxItems: 20, items: {type: object}}
              tabs: {type: object}
              kind: {type: string, enum: [elements, dead, links, downloads, forms, pages]}
              page: {type: string, maxLength: 2048}
        locked_filters:
          type: array
          maxItems: 20
          items:
            oneOf:
              - {type: string}
              - type: object
                required: [dimension, values]
                properties:
                  dimension: {type: string}
                  op: {type: string, enum: [is, is_not, contains, matches]}
                  values: {type: array, maxItems: 100, items: {type: string, maxLength: 2048}}
        max_days: {type: integer, minimum: 0, maximum: 3650, description: 'Only the last N days, including comparison; 0 means any period.'}
        expires: {type: integer, minimum: 0, description: 'Future Unix timestamp, or 0 for no expiry.'}
        hide_realtime: {type: boolean}
        hide_sensitive: {type: boolean}
        branding:
          type: object
          properties:
            title: {type: string}
            logo: {type: integer, minimum: 0, description: Local raster Media Library attachment ID.}
            agency: {type: string}
            agency_logo: {type: integer, minimum: 0}
            website: {type: string, description: HTTP or HTTPS link, never fetched.}
            byline: {type: string}
            accent: {type: string, description: Hex colour; unreadable text accents fall back in each appearance.}
            mode: {type: string, enum: [light, dark, system]}
            credit: {type: boolean}
    Dimension:
      type: string
      enum: [channel, source, utm_source, utm_medium, utm_campaign, utm_term, utm_content, country, device, browser, os, language, login, entry, exit, page, not_found, search, no_results, author, category, post_type, event]
      description: |
        channel: direct, organic_search, paid_search, ai, organic_social,
        paid_social, email, referral, paid_other. source: referring host.
        device: desktop, mobile, tablet, unknown. login: logged_in,
        logged_out (visits recorded before logins were counted are
        logged_out). entry, exit:
        first and last page of a visit. page: any page viewed. not_found:
        a page that answered 404. search: the words of a site search (''
        when not recorded); no_results: searches that found nothing.
        author, category, post_type: what a viewed post, page or other
        single item is; values are user IDs, term IDs and post type names,
        and a filter also takes the name. Pageview dimensions count views
        (pageviews); not_found, search, no_results, author, category and
        post_type are read from the visits, not the daily summaries.
        event: event name.

    Range:
      type: object
      required: [key, from, to, timezone]
      properties:
        key:
          type: string
          description: The range, or prev/year for a comparison range.
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        timezone:
          type: string
          examples: [Europe/London]

    Metrics:
      type: object
      required: [visitors, visits, pageviews, views_per_visit, bounce_rate, visit_duration, events]
      properties:
        visitors:
          type: integer
          description: Distinct visitors per day, summed over the days (no identity crosses days).
        visits:
          type: integer
        pageviews:
          type: integer
        views_per_visit:
          type: number
        bounce_rate:
          type: number
          description: Visits with one pageview and no event, as a fraction of visits.
        visit_duration:
          type: integer
          description: Average visible time per visit, in seconds.
        events:
          type: integer

    Change:
      type: object
      description: (now − then) ÷ then for each metric; null when then is 0.
      additionalProperties:
        type: [number, 'null']

    Answer:
      type: object
      properties:
        generated:
          type: string
          format: date-time
        cached:
          type: boolean

    StatsAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [range, metrics]
          properties:
            range:
              $ref: '#/components/schemas/Range'
            metrics:
              $ref: '#/components/schemas/Metrics'
            compare:
              type: object
              required: [range, metrics, change]
              properties:
                range:
                  $ref: '#/components/schemas/Range'
                metrics:
                  $ref: '#/components/schemas/Metrics'
                change:
                  $ref: '#/components/schemas/Change'

    Point:
      allOf:
        - type: object
          required: [t]
          properties:
            t:
              type: string
              format: date-time
              description: Start of the hour, day or month.
        - $ref: '#/components/schemas/Metrics'

    TimeseriesAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [range, grain, points]
          properties:
            range:
              $ref: '#/components/schemas/Range'
            grain:
              type: string
              enum: [hour, day, month]
            points:
              type: array
              items:
                $ref: '#/components/schemas/Point'
            compare:
              type: object
              required: [range, points]
              properties:
                range:
                  $ref: '#/components/schemas/Range'
                points:
                  type: array
                  items:
                    $ref: '#/components/schemas/Point'

    BreakdownRow:
      type: object
      required: [value, label, visitors, visits, share]
      properties:
        value:
          type: string
          description: What a filter on this dimension takes ('' for none).
        label:
          type: string
        visitors:
          type: integer
        visits:
          type: integer
        share:
          type: number
          description: This row's visits as a fraction of all visits in the range.
        pageviews:
          type: integer
        views_per_visit:
          type: number
        bounce_rate:
          type: number
        visit_duration:
          type: integer
        events:
          type: integer
        time_on_page:
          type: integer
          description: page only. Average visible seconds per view.
        scroll:
          type: integer
          description: page only. Average deepest scroll, percent.
        conversion_rate:
          type: number
          description: event only. Visits with the event as a fraction of all visits.

    BreakdownAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [range, dimension, total, rows]
          properties:
            range:
              $ref: '#/components/schemas/Range'
            dimension:
              $ref: '#/components/schemas/Dimension'
            total:
              $ref: '#/components/schemas/Metrics'
            rows:
              type: array
              items:
                $ref: '#/components/schemas/BreakdownRow'

    Count:
      type: object
      required: [value, label, count]
      properties:
        value:
          type: string
        label:
          type: string
        count:
          type: integer

    RealtimeAnswer:
      type: object
      required: [visitors, pageviews, per_minute, pages, sources, processed, generated]
      properties:
        visitors:
          type: integer
          description: Distinct visitors with a hit in the last 30 minutes.
        pageviews:
          type: integer
        per_minute:
          type: array
          description: Pageviews per minute, oldest first (30 values).
          items:
            type: integer
        pages:
          type: array
          items:
            $ref: '#/components/schemas/Count'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Count'
        processed:
          type: [string, 'null']
          format: date-time
          description: When hits were last processed.
        generated:
          type: string
          format: date-time

    Marker:
      description: One change to the site (an entry of the change log).
      type: object
      required: [id, t, kind, group, label, title, path, old, new, object, meta, source, user]
      properties:
        id:
          type: integer
        t:
          type: string
          format: date-time
          description: When it changed, in the site time zone.
        kind:
          type: string
          description: What changed (the kinds parameter lists them).
        group:
          type: string
          enum: [content, seo, product, site, search, note]
        label:
          type: string
          description: One line saying what changed, in the site's language.
        title:
          type: string
          description: The post, product, coupon, plugin, theme or setting, by name when it changed.
        path:
          type: [string, 'null']
          description: The page it affects; null for site-wide changes.
        old:
          type: string
          description: Value before (a path, title, word count, price, version or setting); empty when there was none. For search_update, its type (core, spam, link_spam, helpful_content, reviews, product_reviews, site_reputation, discover, ranking, crawling, indexing, serving or announcement).
        new:
          type: string
          description: Value after. For search_update, its id at the source.
        object:
          type: object
          required: [type, id]
          properties:
            type:
              type: string
              description: The post type, or coupon, plugin, theme, core, option; for search_update the engine (google, or a key from the feed's name).
            id:
              type: integer
        meta:
          type: object
          description: |
            Details by kind: name; content: before, after, added, removed
            (words); links: added, removed, changed (each to and text);
            external_links: gained, lost (hosts); prices: currency, field
            (regular, sale or price); plugins: file; coupons: fields
            changed (old and new); search_update: name, engine (to show),
            url (at the source), ended (ISO 8601; empty while rolling out;
            only for updates that roll out over a span), feed (other feeds).
          additionalProperties: true
        source:
          type: string
          enum: [wordpress, cli, api, cron, feed, note]
          description: Where the change was made.
        user:
          type: [string, 'null']
          description: Who made it (display name), for people who may list users; else null.

    MarkersAnswer:
      type: object
      required: [range, markers, total]
      properties:
        range:
          $ref: '#/components/schemas/Range'
        markers:
          type: array
          items:
            $ref: '#/components/schemas/Marker'
        total:
          type: integer
          description: Changes in the range that match.

    ChangesAnswer:
      type: object
      required: [range, changes, total, limit, offset]
      properties:
        range:
          $ref: '#/components/schemas/Range'
        changes:
          type: array
          items:
            $ref: '#/components/schemas/Marker'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    ExperimentInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 190
          description: The change and what it should do, in one line.
          examples: [A shorter title lifts CTR]
        change:
          type: integer
          minimum: 0
          description: The change it measures (its id in /changes).
        start:
          type: string
          description: Without change, when the change was made, in the site time zone (2026-10-05 or 2026-10-05 14:30) or Unix time; empty for now.
        page:
          type: string
          description: Its page (a path), or several, comma-separated (up to 50). A site-wide change has no unchanged pages to compare with, so an experiment needs pages.
          examples: [/pricing/]
        days:
          type: integer
          enum: [7, 14, 28, 56, 84]
          default: 28
          description: Days in each window; whole weeks, so both hold each weekday equally often.
        engine:
          $ref: '#/components/schemas/SearchEngine'
        metric:
          type: string
          enum: [clicks, impressions, ctr, position, visits, conversions]
          default: clicks
          description: What it should change. visits are visits from search that landed on its pages; conversions are those visits' conversions of goal.
        direction:
          type: string
          enum: [up, down]
          default: up
          description: For position, up means a better (lower) place.
        threshold:
          type: number
          minimum: 0
          description: The smallest change that counts; percent (default 10), or places for position (default 1).
        goal:
          type: string
          description: For conversions, the goal's id.
        hypothesis:
          type: string
          maxLength: 2000
        note:
          type: string
          maxLength: 2000

    DayWindow:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
          description: Included.

    ExperimentFigures:
      description: Some pages' figures in a window. Search measures give clicks, impressions, ctr and position; visits give visits; conversions give visits, conversions and rate.
      type: object
      properties:
        clicks: {type: integer}
        impressions: {type: integer}
        ctr: {type: [number, 'null']}
        position: {type: [number, 'null']}
        visits: {type: integer}
        conversions: {type: integer}
        rate: {type: [number, 'null']}

    ExperimentMeasurement:
      description: |
        state running: the data does not reach the review day yet (so_far
        days of data after the change). state ready: the experiment's
        pages before and after against the comparison group (pages with
        data in both windows, not in the experiment and with no change of
        their own in the span; the 200 with most impressions, or visits,
        before), the effect, the group's usual spread, the confounders
        and the suggested result.
      type: object
      required: [state, through, review, days, windows]
      properties:
        state:
          type: string
          enum: [running, ready]
        through:
          type: [string, 'null']
          format: date
          description: The newest day with data for the measure.
        review:
          type: string
          format: date
        days:
          type: integer
        so_far:
          type: integer
          description: Running only.
        windows:
          type: object
          properties:
            before: {$ref: '#/components/schemas/DayWindow'}
            after: {$ref: '#/components/schemas/DayWindow'}
        coverage:
          type: [object, 'null']
          description: Days with search data in each window (search measures).
          properties:
            before: {type: integer}
            after: {type: integer}
            days: {type: integer}
        pages:
          type: object
          properties:
            count: {type: integer}
            before: {$ref: '#/components/schemas/ExperimentFigures'}
            after: {$ref: '#/components/schemas/ExperimentFigures'}
        group:
          type: object
          properties:
            count: {type: integer}
            before: {$ref: '#/components/schemas/ExperimentFigures'}
            after: {$ref: '#/components/schemas/ExperimentFigures'}
            change: {type: [number, 'null']}
        compared:
          type: boolean
          description: Whether there were at least 5 pages to compare with; without them the effect is the raw change, only associated with the change made.
        value:
          type: object
          properties:
            before: {type: [number, 'null']}
            after: {type: [number, 'null']}
        change:
          type: [number, 'null']
          description: The raw change; a ratio (0.12 is +12%), or places for position.
        effect:
          type: [number, 'null']
          description: For counts and CTR, the pages' ratio (after ÷ before) over the group's, less 1; for position, the pages' change in places less the group's.
        improvement:
          type: [number, 'null']
          description: The effect in the expected direction; positive when it went the way expected.
        unit:
          type: string
          enum: [ratio, places]
        noise:
          type: [object, 'null']
          description: The 10th to 90th percentile of the group's pages' own effects, each measured as if changed.
          properties:
            low: {type: number}
            high: {type: number}
            pages: {type: integer}
        beyond_noise:
          type: [boolean, 'null']
        enough:
          type: object
          description: Data on its pages in each window against what is needed (20 clicks; 200 impressions for impressions, CTR and position; 20 visits; 5 conversions).
          properties:
            ok: {type: boolean}
            unit: {type: string}
            needed: {type: integer}
            before: {type: integer}
            after: {type: integer}
        confounders:
          type: object
          description: Search engine updates rolling out in either window, site-wide changes in the windows, and other changes on its pages after the start (up to 20 each).
          properties:
            updates:
              type: array
              items: {$ref: '#/components/schemas/Marker'}
            site:
              type: array
              items: {$ref: '#/components/schemas/Marker'}
            pages:
              type: array
              items: {$ref: '#/components/schemas/Marker'}
            total: {type: integer}
        suggested:
          type: string
          enum: [keep, revise, undo, inconclusive]
          description: inconclusive with too little data, within the usual spread, or with no group while a search update rolled out; keep the expected way by at least the threshold; revise the expected way by less; undo the opposite way.
        reasons:
          type: array
          items:
            type: string
            enum: [no_group, search_update, too_little_data, no_measure, within_noise, at_threshold, under_threshold, opposite, no_change]
        summary:
          type: string
          description: One sentence saying what was found, in the site's language.

    Experiment:
      type: object
      required: [id, name, start, days, windows, review, engine, metric, direction, threshold, pages, status, result, due, measurement]
      properties:
        id: {type: integer}
        name: {type: string}
        hypothesis: {type: string}
        note: {type: string}
        created:
          type: string
          format: date-time
        user:
          type: [string, 'null']
          description: Who recorded it, for people who may list users.
        start:
          type: string
          format: date-time
        days: {type: integer}
        windows:
          type: object
          properties:
            before: {$ref: '#/components/schemas/DayWindow'}
            after: {$ref: '#/components/schemas/DayWindow'}
        review:
          type: string
          format: date
          description: The after window's last day.
        engine:
          $ref: '#/components/schemas/SearchEngine'
        metric:
          type: string
          enum: [clicks, impressions, ctr, position, visits, conversions]
        direction:
          type: string
          enum: [up, down]
        threshold:
          type: number
          description: Percent, or places for position.
        change_id:
          type: [integer, 'null']
        pages:
          type: array
          items: {type: string}
        goal:
          type: [object, 'null']
          properties:
            id: {type: string}
            name: {type: [string, 'null']}
        status:
          type: string
          enum: [running, decided, cancelled]
        result:
          type: [string, 'null']
          enum: [keep, revise, undo, inconclusive, null]
        decided:
          type: [string, 'null']
          format: date-time
        due:
          type: boolean
          description: Running, with data through the review day.
        through:
          type: [string, 'null']
          format: date
        measurement:
          description: Running, now; decided, as it was at the decision; cancelled, null.
          oneOf:
            - $ref: '#/components/schemas/ExperimentMeasurement'
            - type: 'null'

    ExperimentsAnswer:
      type: object
      required: [experiments, total]
      properties:
        experiments:
          type: array
          items:
            $ref: '#/components/schemas/Experiment'
        total:
          type: integer

    QueueItem:
      allOf:
        - $ref: '#/components/schemas/OpportunityPage'
        - type: object
          required: [key, kind, engine, status, found, query, why, todo, figures, metric, parts, score, note, updated, user, effort_set, experiment_id, experiment]
          properties:
            key:
              type: string
              description: 16 hex characters, from kind, engine, page and query.
            kind:
              type: string
              enum: [ctr, missing, striking, decay, overlap, audit, links]
            engine:
              $ref: '#/components/schemas/SearchEngine'
            status:
              type: string
              enum: [new, accepted, done, dismissed]
            finding:
              description: audit, the finding (one item per page and finding); links, the list (one item per page and list). Null for other kinds.
              oneOf:
                - $ref: '#/components/schemas/AuditFinding'
                - $ref: '#/components/schemas/LinksKind'
                - type: 'null'
            found:
              type: boolean
              description: Whether the opportunity is still found in this period; else as it was when acted on.
            query:
              type: [string, 'null']
              description: The query; null for decay (a page).
            why:
              type: string
              description: Why it is listed, in the site's language.
            todo:
              type: string
              description: What to do, in the site's language.
            figures:
              type: object
              description: The numbers behind it; which are there depends on the kind.
              properties:
                clicks:
                  type: integer
                impressions:
                  type: integer
                ctr:
                  type: number
                position:
                  type: [number, 'null']
                expected_ctr:
                  type: number
                potential:
                  type: integer
                then_clicks:
                  type: integer
                then_position:
                  type: number
                lost:
                  type: integer
                cause:
                  type: string
                  enum: [position, demand, ctr, gone]
                match:
                  type: string
                  enum: [partial, none]
                missing:
                  type: array
                  items:
                    type: string
                question:
                  type: boolean
                switched:
                  type: boolean
                  description: overlap; whether the leading page changed between the halves of the period.
                pages:
                  type: array
                  description: overlap; the pages sharing the query, most impressions first. Done measures them all.
                  items:
                    type: object
                    required: [path_id, path, clicks, impressions, position, share]
                    properties:
                      path_id:
                        type: integer
                      path:
                        type: string
                      clicks:
                        type: integer
                      impressions:
                        type: integer
                      position:
                        type: number
                      share:
                        type: number
                finding:
                  $ref: '#/components/schemas/AuditFinding'
                share:
                  type: number
                  description: audit and links; the share of the page's expected clicks the finding or list puts at stake.
                facts:
                  $ref: '#/components/schemas/AuditFacts'
                same:
                  type: array
                  description: audit; the other pages with the same title or description.
                  items:
                    type: string
                list:
                  $ref: '#/components/schemas/LinksKind'
                links_in:
                  type: integer
                  description: links, orphans and converting; other pages linking to the page.
                from:
                  type: array
                  description: links, orphans and converting; pages linking to it (up to five).
                  items:
                    type: string
                visits:
                  type: integer
                conversions:
                  type: [integer, 'null']
                link_from:
                  type: object
                  description: links, missing; the page that should link to this one.
                  properties:
                    path_id:
                      type: integer
                    path:
                      type: string
                    url:
                      type: string
                from_impressions:
                  type: integer
                  description: links, missing; the impressions of the searches on the page that should link.
                from_position:
                  type: number
                queries:
                  type: array
                  description: links, missing; the searches, as LinksMissingRow's.
                  items:
                    type: object
                query_count:
                  type: integer
            metric:
              type: string
              enum: [clicks, impressions, ctr, position]
              description: The measure of the experiment done opens (impressions for an audit item's noindex or canonical).
            parts:
              type: object
              required: [clicks, value, confidence, effort]
              properties:
                clicks:
                  type: number
                  description: Potential clicks per 28 days.
                value:
                  type: number
                  description: 1 to rules.max_value.
                confidence:
                  type: number
                  description: 0 to the kind's own.
                effort:
                  type: integer
                  minimum: 1
                  maximum: 5
            score:
              type: number
              description: clicks × value × confidence ÷ effort.
            note:
              type: string
            updated:
              type: [string, 'null']
              format: date-time
            user:
              type: [string, 'null']
              description: Who acted, for people who may list users.
            effort_set:
              type: boolean
              description: Whether someone set the effort.
            experiment_id:
              type: [integer, 'null']
            experiment:
              type: [object, 'null']
              description: Done, the experiment it opened, with its state and result.
              properties:
                id:
                  type: integer
                name:
                  type: string
                status:
                  type: string
                  enum: [running, decided, cancelled]
                result:
                  type: [string, 'null']
                  enum: [keep, revise, undo, inconclusive, null]
                due:
                  type: boolean
                review:
                  type: string
                  format: date
                metric:
                  type: string
                state:
                  type: [string, 'null']
                  enum: [running, ready, null]
                effect:
                  type: [number, 'null']
                unit:
                  type: [string, 'null']
                  enum: [ratio, places, null]
                suggested:
                  type: [string, 'null']
                summary:
                  type: [string, 'null']

    QueueAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [engine, engines, range, days, cut, through, connected, ignored, goal, goals, site_rate, rules, left_out, status, counts, items, total, more]
          properties:
            engine:
              $ref: '#/components/schemas/SearchEngine'
            engines:
              $ref: '#/components/schemas/SearchEngines'
            range:
              $ref: '#/components/schemas/Range'
            days:
              type: integer
            cut:
              type: boolean
              description: Whether the period was cut at the newest search day or to its newest 91 days.
            through:
              type: string
              description: Newest day with search data (YYYY-MM-DD); empty with none.
            connected:
              type: boolean
            ignored:
              type: array
              items:
                type: string
            goal:
              type: [object, 'null']
              description: The goal giving value; null without goals.
              properties:
                id:
                  type: string
                name:
                  type: string
            goals:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
            site_rate:
              type: [number, 'null']
              description: The site's conversion rate of visits from search for the goal.
            rules:
              type: object
              description: The constants the score uses.
            left_out:
              type: integer
              description: New items left out because their page has a running experiment.
            status:
              type: string
              enum: [open, new, accepted, done, dismissed, all]
            counts:
              type: object
              description: Items in each state (dismissed ones only while hidden).
              properties:
                new:
                  type: integer
                accepted:
                  type: integer
                done:
                  type: integer
                dismissed:
                  type: integer
            items:
              type: array
              items:
                $ref: '#/components/schemas/QueueItem'
            total:
              type: integer
            more:
              type: boolean

    GoalStep:
      type: object
      required: [kind, match]
      properties:
        name:
          type: string
          maxLength: 100
          description: Shown in reports. A goal without one is named after its match.
        kind:
          type: string
          enum: [page, event]
          description: page — a page viewed; event — an event sent.
        match:
          type: string
          maxLength: 300
          description: The path (/pricing/) or event name (Purchase); `*` is any text (/blog/*).

    Goal:
      allOf:
        - type: object
          required: [id, name]
          properties:
            id:
              type: string
        - $ref: '#/components/schemas/GoalStep'

    FunnelInput:
      type: object
      required: [name, steps]
      properties:
        name:
          type: string
          maxLength: 100
        steps:
          type: array
          minItems: 2
          maxItems: 12
          description: In the order they are reached within one visit. Step names may be empty.
          items:
            $ref: '#/components/schemas/GoalStep'

    Funnel:
      allOf:
        - type: object
          required: [id]
          properties:
            id:
              type: string
        - $ref: '#/components/schemas/FunnelInput'

    Revenue:
      type: object
      required: [currency, amount, count]
      description: Revenue in one currency; amounts in different currencies are never added.
      properties:
        currency:
          type: string
          description: ISO 4217 code.
          examples: [USD]
        amount:
          type: number
          description: In the currency's main unit (dollars, not cents).
        count:
          type: integer
          description: Events that carried revenue in this currency.

    GoalRow:
      allOf:
        - $ref: '#/components/schemas/Goal'
        - type: object
          required: [visitors, visits, completions, conversion_rate, revenue]
          properties:
            visitors:
              type: integer
            visits:
              type: integer
              description: Visits that reached the goal (conversions).
            completions:
              type: integer
              description: Times it was reached (pageviews or events).
            conversion_rate:
              type: number
              description: visits ÷ all visits in the range.
            revenue:
              type: array
              items:
                $ref: '#/components/schemas/Revenue'
            change:
              $ref: '#/components/schemas/Change'

    GoalsAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [range, visits, goals]
          properties:
            range:
              $ref: '#/components/schemas/Range'
            visits:
              type: integer
              description: All visits in the range (with the filters).
            goals:
              type: array
              items:
                $ref: '#/components/schemas/GoalRow'
            compare:
              type: object
              description: The comparison period's answer; each goal row then has `change` (visits, completions, conversion_rate).
              properties:
                range:
                  $ref: '#/components/schemas/Range'
                visits:
                  type: integer
                goals:
                  type: array
                  items:
                    $ref: '#/components/schemas/GoalRow'

    FunnelStepRow:
      allOf:
        - $ref: '#/components/schemas/GoalStep'
        - type: object
          required: [visits, rate, step_rate, dropped]
          properties:
            visits:
              type: integer
              description: Visits that reached this step in order.
            rate:
              type: number
              description: Of the visits that entered the funnel.
            step_rate:
              type: number
              description: Of the visits at the step before.
            dropped:
              type: integer
              description: Visits at the step before that did not reach this one.

    FunnelRow:
      type: object
      required: [id, name, entered, completed, completion_rate, conversion_rate, steps]
      properties:
        id:
          type: string
        name:
          type: string
        entered:
          type: integer
        completed:
          type: integer
        completion_rate:
          type: number
          description: completed ÷ entered.
        conversion_rate:
          type: number
          description: completed ÷ all visits in the range.
        steps:
          type: array
          items:
            $ref: '#/components/schemas/FunnelStepRow'
        change:
          $ref: '#/components/schemas/Change'

    FunnelsAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [range, visits, funnels]
          properties:
            range:
              $ref: '#/components/schemas/Range'
            visits:
              type: integer
            funnels:
              type: array
              items:
                $ref: '#/components/schemas/FunnelRow'
            compare:
              type: object
              description: The comparison period's answer; each funnel row then has `change` (entered, completed, conversion_rate).
              properties:
                range:
                  $ref: '#/components/schemas/Range'
                visits:
                  type: integer
                funnels:
                  type: array
                  items:
                    $ref: '#/components/schemas/FunnelRow'

    PropertyRow:
      type: object
      required: [value, label, count, visits, share, revenue]
      properties:
        value:
          type: string
          description: The key (without `key`) or the value.
        label:
          type: string
        count:
          type: integer
          description: Times it was sent.
        visits:
          type: integer
        share:
          type: number
          description: visits ÷ all visits in the range.
        revenue:
          type: array
          description: With `key` only.
          items:
            $ref: '#/components/schemas/Revenue'

    PropertiesAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [range, key, event, visits, rows]
          properties:
            range:
              $ref: '#/components/schemas/Range'
            key:
              type: string
            event:
              type: string
            visits:
              type: integer
            rows:
              type: array
              items:
                $ref: '#/components/schemas/PropertyRow'

    ClickTotals:
      type: object
      required: [clicks, dead, dead_rate, links, outbound, affiliate, downloads, forms, visits]
      properties:
        clicks:
          type: integer
          description: Clicks (form submits are counted apart).
        dead:
          type: integer
          description: Clicks the page did not react to within a second.
        dead_rate:
          type: number
          description: dead ÷ clicks.
        links:
          type: integer
          description: Clicks with a destination (links, here or elsewhere).
        outbound:
          type: integer
        affiliate:
          type: integer
        downloads:
          type: integer
          description: Clicks on file links.
        forms:
          type: integer
          description: Forms sent.
        visits:
          type: integer
          description: Visits with a click or form submit.

    ClickRow:
      type: object
      required: [selector, label, target, count, visits, share, dead, dead_rate, outbound, affiliate, download, fields]
      properties:
        selector:
          type: string
          description: tag#id.class of the element or form.
          examples: [a.wp-block-button__link]
        label:
          type: string
          description: Its text, or a form's name; emails and long numbers masked; '' when hidden with data-sps-mask.
        target:
          type: string
          description: "Destination; a path here, origin and path elsewhere, or mailto:/tel: without the address."
        count:
          type: integer
        visits:
          type: integer
        share:
          type: number
          description: count ÷ all clicks (forms ÷ all forms sent).
        dead:
          type: integer
        dead_rate:
          type: number
        outbound:
          type: boolean
        affiliate:
          type: boolean
        download:
          type: boolean
        fields:
          type: integer
          description: A form's fields (never their values); 0 for clicks.
        path:
          type: string
          description: Pages rows only; the page where clicks happened.
        url:
          type: string
          description: Pages rows only; address on this site.
        post_id:
          type: integer
          description: Pages rows only; 0 when no post matches.
        edit_url:
          type: [string, 'null']
          description: Pages rows only; null without edit_post permission. Shared read-only views omit it.
        links:
          type: integer
          description: Pages rows only; link clicks on the page.
        forms:
          type: integer
          description: Pages rows only; forms sent on the page.

    ClickPageInfo:
      type: [object, 'null']
      description: Exact local page only; null for an empty page or a wildcard. Post identity is resolved inside the report cache, edit permission checked on every request. Shared read-only views must omit edit_url.
      required: [path, url, post_id]
      properties:
        path:
          type: string
        url:
          type: string
        post_id:
          type: integer
          description: 0 when no post matches, including made-up demo paths.
        edit_url:
          type: [string, 'null']
          description: Editor address only when the current user can edit the post; otherwise null.

    ClicksAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [range, kind, page, page_info, totals, rows]
          properties:
            range:
              $ref: '#/components/schemas/Range'
            kind:
              type: string
              enum: [elements, dead, links, downloads, forms, pages]
            page:
              type: string
            page_info:
              $ref: '#/components/schemas/ClickPageInfo'
            totals:
              $ref: '#/components/schemas/ClickTotals'
            rows:
              type: array
              items:
                $ref: '#/components/schemas/ClickRow'
            compare:
              type: object
              required: [range, totals, change]
              properties:
                range:
                  $ref: '#/components/schemas/Range'
                totals:
                  $ref: '#/components/schemas/ClickTotals'
                change:
                  type: object
                  description: (now − then) ÷ then per total; null when then is 0.
                  additionalProperties:
                    type: [number, 'null']

    SearchMetrics:
      type: object
      required: [clicks, impressions, ctr, position]
      properties:
        clicks:
          type: integer
        impressions:
          type: integer
        ctr:
          type: number
          description: clicks ÷ impressions.
        position:
          type: number
          description: Average position weighted by impressions; lower is better; 0 without impressions.

    SearchChange:
      type: object
      description: (now − then) ÷ then for clicks, impressions and CTR (null when then is 0); for position, now − then in places (negative is a climb; null when either has no impressions).
      required: [clicks, impressions, ctr, position]
      properties:
        clicks:
          type: [number, 'null']
        impressions:
          type: [number, 'null']
        ctr:
          type: [number, 'null']
        position:
          type: [number, 'null']

    SearchPoint:
      allOf:
        - $ref: '#/components/schemas/SearchMetrics'
        - type: object
          required: [t]
          properties:
            t:
              type: string
              format: date-time
              description: Start of the day or month.

    SearchRow:
      allOf:
        - $ref: '#/components/schemas/SearchMetrics'
        - type: object
          required: [id, value, label, share]
          properties:
            id:
              type: string
              description: Query or page ID, country code (ISO 3166-1 alpha-3, as Search Console gives it) or device code.
            value:
              type: string
              description: The query, the page path, the country (ISO 3166-1 alpha-2; empty when unknown) or the device (desktop, mobile, tablet, unknown).
            label:
              type: string
            share:
              type: number
              description: clicks ÷ all clicks of the period.
            path:
              type: string
              description: Pages rows only.
            url:
              type: string
              description: Pages rows only.
            post_id:
              type: integer
              description: Pages rows only; 0 when no post matches.
            edit_url:
              type: [string, 'null']
              description: Pages rows only; only when the current user can edit the post.
            compare:
              description: With a comparison.
              allOf:
                - $ref: '#/components/schemas/SearchMetrics'
                - type: object
                  required: [change]
                  properties:
                    change:
                      $ref: '#/components/schemas/SearchChange'

    SearchAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [engine, engines, range, through, first, connected, kind, page, query, page_info, ignored, totals, grain, points, rows, more]
          properties:
            engine:
              $ref: '#/components/schemas/SearchEngine'
            engines:
              $ref: '#/components/schemas/SearchEngines'
            range:
              $ref: '#/components/schemas/Range'
            through:
              type: string
              description: Newest day with search data (YYYY-MM-DD); empty with none.
            first:
              type: string
              description: Oldest day with search data (YYYY-MM-DD); empty with none.
            connected:
              type: boolean
              description: Whether the engine's source is connected (demo data, always).
            kind:
              type: string
              enum: [queries, pages, countries, devices]
            page:
              type: string
            query:
              type: string
            page_info:
              $ref: '#/components/schemas/ClickPageInfo'
            ignored:
              type: array
              description: Filter dimensions left out (only page filters apply to search data).
              items:
                type: string
            totals:
              $ref: '#/components/schemas/SearchMetrics'
            grain:
              type: string
              enum: [day, week, month]
              description: week for a page or query of Bing (each point is the week's last day).
            points:
              type: array
              items:
                $ref: '#/components/schemas/SearchPoint'
            rows:
              type: array
              items:
                $ref: '#/components/schemas/SearchRow'
            more:
              type: boolean
              description: Whether there are more rows after these.
            compare:
              type: object
              required: [range, totals, change, points]
              properties:
                range:
                  $ref: '#/components/schemas/Range'
                totals:
                  $ref: '#/components/schemas/SearchMetrics'
                change:
                  $ref: '#/components/schemas/SearchChange'
                points:
                  type: array
                  items:
                    $ref: '#/components/schemas/SearchPoint'

    OpportunityPage:
      type: object
      required: [path_id, path, url, post_id, edit_url]
      properties:
        path_id:
          type: integer
        path:
          type: string
        url:
          type: string
        post_id:
          type: integer
          description: 0 when no post matches.
        edit_url:
          type: [string, 'null']
          description: Only when the current user can edit the post.

    OpportunityPair:
      description: A page's query (striking and ctr).
      allOf:
        - $ref: '#/components/schemas/OpportunityPage'
        - $ref: '#/components/schemas/SearchMetrics'
        - type: object
          required: [query, expected_ctr, potential]
          properties:
            query:
              type: string
            expected_ctr:
              type: number
              description: The site's CTR at position 3 (striking) or at the query's position (ctr).
            potential:
              type: integer
              description: Clicks it could gain (striking) or misses (ctr) in the period.

    OpportunityDecay:
      description: A page losing clicks (decay).
      allOf:
        - $ref: '#/components/schemas/OpportunityPage'
        - $ref: '#/components/schemas/SearchMetrics'
        - type: object
          required: [compare, lost, cause, why, queries, changes]
          properties:
            compare:
              description: The earlier period.
              allOf:
                - $ref: '#/components/schemas/SearchMetrics'
                - type: object
                  required: [change]
                  properties:
                    change:
                      $ref: '#/components/schemas/SearchChange'
            lost:
              type: integer
              description: Clicks then − clicks now.
            cause:
              type: string
              enum: [position, demand, ctr, gone]
            why:
              type: string
              description: One sentence saying why, in the site's language.
            queries:
              type: array
              description: The queries that lost most clicks (up to 3).
              items:
                type: object
                required: [query, lost, clicks, then_clicks, position, then_position]
                properties:
                  query:
                    type: string
                  lost:
                    type: integer
                  clicks:
                    type: integer
                  then_clicks:
                    type: integer
                  position:
                    type: [number, 'null']
                    description: Null without impressions.
                  then_position:
                    type: [number, 'null']
            changes:
              type: array
              description: The site's recorded changes on the page in both periods, newest first (up to 5).
              items:
                $ref: '#/components/schemas/Marker'

    CoverageResult:
      type: object
      required: [match, phrase, missing, question]
      properties:
        match:
          type: string
          enum: [title, heading, text, partial, none]
          description: How far the page's words cover the query, best first.
        phrase:
          type: boolean
          description: The query's words are on the page in order.
        missing:
          type: array
          description: The query's words the page does not have.
          items:
            type: string
        question:
          type: boolean

    OpportunityMissing:
      description: A page's query its words do not cover, or only partly (missing).
      allOf:
        - $ref: '#/components/schemas/OpportunityPage'
        - $ref: '#/components/schemas/SearchMetrics'
        - $ref: '#/components/schemas/CoverageResult'
        - type: object
          required: [query]
          properties:
            query:
              type: string

    OpportunityOverlap:
      description: A query shared by pages, a candidate to review (overlap). The page fields are the leading page's; the figures are the query's over all its pages.
      allOf:
        - $ref: '#/components/schemas/OpportunityPage'
        - $ref: '#/components/schemas/SearchMetrics'
        - type: object
          required: [query, pages, page_count, leaders, switched, potential]
          properties:
            query:
              type: string
            pages:
              type: array
              description: Most impressions first.
              items:
                allOf:
                  - $ref: '#/components/schemas/OpportunityPage'
                  - $ref: '#/components/schemas/SearchMetrics'
                  - type: object
                    required: [share]
                    properties:
                      share:
                        type: number
                        description: Share of the query's impressions on its pages.
            page_count:
              type: integer
              description: Pages with the share or more, including any not listed.
            leaders:
              type: array
              description: Path of the page with most impressions in the first and in the second half; null when none.
              minItems: 2
              maxItems: 2
              items:
                type: [string, 'null']
            switched:
              type: boolean
              description: Whether the leading page changed between the halves.
            potential:
              type: integer
              description: Clicks it would have if all its pages' impressions had the best of their CTRs, less its clicks.

    CoverageAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [page, post_id, page_info, range, days, cut, through, first, connected, text, focus, totals, rows, more]
          properties:
            page:
              type: string
            post_id:
              type: integer
              description: The page's post; 0 when it is not one post.
            page_info:
              type: [object, 'null']
              description: Path, url, post_id and edit_url (only when the current user can edit the post).
            range:
              $ref: '#/components/schemas/Range'
            days:
              type: integer
            cut:
              type: boolean
            through:
              type: string
            first:
              type: string
            connected:
              type: boolean
            text:
              type: [object, 'null']
              description: What the page's words were read from; null when it is not one post.
              properties:
                source:
                  type: string
                  enum: [post, demo]
                words:
                  type: integer
                plugin:
                  type: string
                  description: The SEO plugin read (rank-math, yoast, seopress, aioseo, or another named by the seoprostats_focus_keywords filter; demo for demo data); empty for none.
                seo_title:
                  type: string
                  description: The SEO title, without its plugin's variables.
                description:
                  type: string
            focus:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/CoverageResult'
                  - type: object
                    required: [keyword, source, searched, clicks, impressions, position]
                    properties:
                      keyword:
                        type: string
                      source:
                        type: string
                      searched:
                        type: boolean
                        description: Whether it is a query the page showed for.
                      clicks:
                        type: integer
                      impressions:
                        type: integer
                      position:
                        type: [number, 'null']
            totals:
              type: object
              required: [queries, impressions, clicks, covered, missing, questions]
              properties:
                queries:
                  type: integer
                impressions:
                  type: integer
                clicks:
                  type: integer
                covered:
                  type: number
                  description: Share of impressions on queries the page covers (title, heading or text).
                missing:
                  type: integer
                  description: Queries covered partly or not at all.
                questions:
                  type: integer
            rows:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/SearchMetrics'
                  - $ref: '#/components/schemas/CoverageResult'
                  - type: object
                    required: [query]
                    properties:
                      query:
                        type: string
            more:
              type: boolean
              description: Whether the page has more than 200 queries.

    OpportunitiesAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [engine, engines, kind, range, days, cut, through, first, connected, ignored, rules, rows, total, more]
          properties:
            engine:
              $ref: '#/components/schemas/SearchEngine'
            engines:
              $ref: '#/components/schemas/SearchEngines'
            kind:
              type: string
              enum: [striking, ctr, decay, missing, overlap]
            range:
              $ref: '#/components/schemas/Range'
            days:
              type: integer
              description: Days read; 0 without search data.
            cut:
              type: boolean
              description: Whether the period was cut to its newest 91 days.
            through:
              type: string
              description: Newest day with search data (YYYY-MM-DD); empty with none.
            first:
              type: string
              description: Oldest day with search data (YYYY-MM-DD); empty with none.
            connected:
              type: boolean
              description: Whether the engine's source is connected (demo data, always).
            ignored:
              type: array
              description: Filter dimensions left out (only page filters apply to search data).
              items:
                type: string
            rules:
              type: object
              description: |
                The thresholds used. striking: min_impressions,
                position_from, position_to, target. ctr: min_impressions,
                position_from, position_to, under. decay: min_lost,
                min_share. missing: min_impressions, position_from,
                position_to, pages. overlap: min_impressions, min_share,
                pages.
              additionalProperties:
                type: number
            rows:
              type: array
              description: OpportunityPair rows (striking, ctr), OpportunityDecay rows (decay), OpportunityMissing rows (missing) or OpportunityOverlap rows (overlap).
              items:
                oneOf:
                  - $ref: '#/components/schemas/OpportunityPair'
                  - $ref: '#/components/schemas/OpportunityDecay'
                  - $ref: '#/components/schemas/OpportunityMissing'
                  - $ref: '#/components/schemas/OpportunityOverlap'
            halves:
              type: [array, 'null']
              description: overlap; the first and second half of the period (whole weeks for Bing), null when too short to halve.
              items:
                $ref: '#/components/schemas/Range'
            total:
              type: integer
              description: All opportunities of this kind.
            more:
              type: boolean
              description: Whether there are more rows after these.
            curve:
              type: [object, 'null']
              description: striking and ctr; null without search data.
              required: [source, ctr]
              properties:
                source:
                  type: string
                  enum: [site, mixed, default]
                  description: The site's own CTR at every position, at some, or at none (a cautious default).
                ctr:
                  type: object
                  description: CTR by position, "1" to "20".
                  additionalProperties:
                    type: number
            compare:
              type: [object, 'null']
              description: decay; the earlier period, null without search data.
              required: [range]
              properties:
                range:
                  $ref: '#/components/schemas/Range'
            updates:
              type: array
              description: decay; search engine updates in either period.
              items:
                $ref: '#/components/schemas/Marker'

    AuditFinding:
      type: string
      enum: [noindex, canonical, thin, title_missing, title_duplicate, title_long, description_missing, description_duplicate, description_long, h1_none, h1_several, images_alt]
      description: A content audit finding; the list is most serious first.

    AuditFacts:
      type: object
      description: What the content audit read from a page's post and SEO plugin fields.
      required: [title_length, seo_title_length, description_length, h1, words, images, images_no_alt, noindex, canonical_away, modified, checked]
      properties:
        title_length:
          type: integer
          description: Characters of the title shown (the SEO title, else the post title).
        seo_title_length:
          type: integer
          description: Characters of the SEO title as written; 0 when it is made of the plugin's variables.
        description_length:
          type: integer
          description: Characters of the description (the SEO plugin's, else the excerpt).
        h1:
          type: integer
          description: H1s in the text (themes show the title as one more).
        words:
          type: integer
        images:
          type: integer
        images_no_alt:
          type: integer
        noindex:
          type: boolean
        canonical_away:
          type: boolean
          description: Whether the canonical address is another page.
        modified:
          type: [string, 'null']
          format: date-time
        checked:
          type: string
          format: date-time
          description: When the facts were read.

    AuditRow:
      allOf:
        - $ref: '#/components/schemas/OpportunityPage'
        - $ref: '#/components/schemas/SearchMetrics'
        - type: object
          required: [findings, facts, same_title, same_description]
          properties:
            findings:
              type: array
              items:
                $ref: '#/components/schemas/AuditFinding'
            facts:
              $ref: '#/components/schemas/AuditFacts'
            same_title:
              type: array
              description: Other pages with the same title (up to five).
              items:
                type: string
            same_description:
              type: array
              description: Other pages with the same description (up to five).
              items:
                type: string

    AuditAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [engine, engines, range, days, cut, through, first, connected, ignored, finding, rules, checked, plugin, counts, pages, rows, total, more]
          properties:
            engine:
              $ref: '#/components/schemas/SearchEngine'
            engines:
              $ref: '#/components/schemas/SearchEngines'
            range:
              $ref: '#/components/schemas/Range'
            days:
              type: integer
              description: Days of search figures; 0 without search data.
            cut:
              type: boolean
            through:
              type: string
            first:
              type: string
            connected:
              type: boolean
            ignored:
              type: array
              items:
                type: string
            finding:
              type: string
              description: The finding asked for; empty for all.
            rules:
              type: object
              required: [title_max, description_max, thin_words, thin_impressions, batch, stale_days]
              properties:
                title_max:
                  type: integer
                description_max:
                  type: integer
                thin_words:
                  type: integer
                thin_impressions:
                  type: integer
                  description: Impressions in the period from which a short page with no clicks is thin.
                batch:
                  type: integer
                  description: Posts the daily cron reads at most.
                stale_days:
                  type: integer
                  description: Days after which a page's facts are read again.
            checked:
              type: object
              required: [pages, oldest, newest]
              properties:
                pages:
                  type: integer
                  description: Pages with facts.
                oldest:
                  type: [string, 'null']
                  format: date-time
                newest:
                  type: [string, 'null']
                  format: date-time
            plugin:
              type: string
              enum: [rank-math, yoast, seopress, aioseo, demo, '']
              description: The SEO plugin the fields are read from; empty without one.
            counts:
              type: object
              description: Pages per finding, whatever finding is asked for.
              additionalProperties:
                type: integer
            pages:
              type: integer
              description: Pages with any finding.
            rows:
              type: array
              description: Most impressions first.
              items:
                $ref: '#/components/schemas/AuditRow'
            total:
              type: integer
            more:
              type: boolean

    LinksKind:
      type: string
      enum: [orphans, converting, missing]
      default: orphans

    LinksPageRow:
      description: An orphan page, or a converting page with few links in.
      allOf:
        - $ref: '#/components/schemas/OpportunityPage'
        - $ref: '#/components/schemas/SearchMetrics'
        - type: object
          required: [visits, conversions, links_in, from]
          properties:
            visits:
              type: integer
              description: Visits from search that started on the page.
            conversions:
              type: [integer, 'null']
              description: Those visits that reached the goal; null without goals.
            links_in:
              type: integer
              description: Other pages whose text links to it.
            from:
              type: array
              description: Pages linking to it (up to five).
              items:
                type: string

    LinksMissingRow:
      description: A page (its figures for the searches) that does not link to the page with most clicks for them (`to`, its figures for them).
      allOf:
        - $ref: '#/components/schemas/OpportunityPage'
        - $ref: '#/components/schemas/SearchMetrics'
        - type: object
          required: [to, queries, query_count]
          properties:
            to:
              allOf:
                - $ref: '#/components/schemas/OpportunityPage'
                - $ref: '#/components/schemas/SearchMetrics'
            queries:
              type: array
              description: Up to rules.queries searches, most impressions first.
              items:
                type: object
                required: [query, clicks, impressions, position, to_clicks, to_position]
                properties:
                  query:
                    type: string
                  clicks:
                    type: integer
                  impressions:
                    type: integer
                  position:
                    type: number
                  to_clicks:
                    type: integer
                  to_position:
                    type: number
            query_count:
              type: integer

    LinksAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [engine, engines, range, days, cut, through, first, connected, ignored, kind, rules, read, goal, goals, counts, rows, total, more]
          properties:
            engine:
              $ref: '#/components/schemas/SearchEngine'
            engines:
              $ref: '#/components/schemas/SearchEngines'
            range:
              $ref: '#/components/schemas/Range'
            days:
              type: integer
              description: Days of search figures; 0 without search data.
            cut:
              type: boolean
            through:
              type: string
            first:
              type: string
            connected:
              type: boolean
            ignored:
              type: array
              items:
                type: string
            kind:
              $ref: '#/components/schemas/LinksKind'
            rules:
              type: object
              required: [few_links, min_conversions, min_impressions, queries, max_links]
              properties:
                few_links:
                  type: integer
                  description: Pages linking in at most for a converting page to be listed.
                min_conversions:
                  type: integer
                min_impressions:
                  type: integer
                  description: Impressions a page needs on a search for a missing link.
                queries:
                  type: integer
                max_links:
                  type: integer
                  description: Pages a page's links are kept to, at most.
            read:
              type: object
              required: [pages, read, complete]
              properties:
                pages:
                  type: integer
                  description: Published pages the content audit has read.
                read:
                  type: integer
                  description: Those whose links were read.
                complete:
                  type: boolean
            goal:
              type: [object, 'null']
              description: The goal counted; null without goals.
              properties:
                id:
                  type: string
                name:
                  type: string
            goals:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
            counts:
              type: object
              description: Rows per list, whatever kind is asked for.
              additionalProperties:
                type: integer
            rows:
              type: array
              description: LinksPageRow for orphans and converting, LinksMissingRow for missing.
              items:
                oneOf:
                  - $ref: '#/components/schemas/LinksPageRow'
                  - $ref: '#/components/schemas/LinksMissingRow'
            total:
              type: integer
            more:
              type: boolean

    SearchEngine:
      type: string
      enum: [google, bing]
      description: The search engine answered for.

    SearchEngines:
      type: array
      description: The engines with search data or a connected source, Google first (at least Google).
      items:
        type: string
        enum: [google, bing]

    ContentMetrics:
      description: Search figures (the chosen engine's) with the visits from organic search that started on the page.
      allOf:
        - $ref: '#/components/schemas/SearchMetrics'
        - type: object
          required: [visits, bounce_rate, views_per_visit, visit_duration, conversions, conversion_rate]
          properties:
            visits:
              type: integer
              description: Visits from organic search (any engine) that started on the page.
            bounce_rate:
              type: number
            views_per_visit:
              type: number
            visit_duration:
              type: integer
              description: Seconds.
            conversions:
              type: [integer, 'null']
              description: Of those visits, the ones that reached the goal; null without goals.
            conversion_rate:
              type: [number, 'null']
              description: conversions ÷ visits; null without goals.

    ContentChange:
      description: As SearchChange, with relative changes of the visit metrics and conversions.
      type: object
      additionalProperties:
        type: [number, 'null']

    ContentRow:
      allOf:
        - $ref: '#/components/schemas/OpportunityPage'
        - $ref: '#/components/schemas/ContentMetrics'
        - type: object
          required: [id, value, label]
          properties:
            id:
              type: string
            value:
              type: string
            label:
              type: string
            compare:
              description: The comparison period.
              allOf:
                - $ref: '#/components/schemas/ContentMetrics'
                - type: object
                  required: [change]
                  properties:
                    change:
                      $ref: '#/components/schemas/ContentChange'

    ContentAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [engine, engines, range, through, first, connected, ignored, sort, goal, goals, landings_from, partial, totals, rows, total, more]
          properties:
            engine:
              $ref: '#/components/schemas/SearchEngine'
            engines:
              $ref: '#/components/schemas/SearchEngines'
            range:
              $ref: '#/components/schemas/Range'
            through:
              type: string
              description: Newest day with search data (YYYY-MM-DD); empty with none.
            first:
              type: string
              description: Oldest day with search data (YYYY-MM-DD); empty with none.
            connected:
              type: boolean
              description: Whether the engine's source is connected (demo data, always).
            ignored:
              type: array
              description: Filter dimensions left out (only page filters apply to search data).
              items:
                type: string
            sort:
              type: string
              enum: [clicks, visits, conversions]
            goal:
              type: [object, 'null']
              description: The goal counted; null without goals.
              required: [id, name, kind, match]
              properties:
                id:
                  type: string
                name:
                  type: string
                kind:
                  type: string
                match:
                  type: string
            goals:
              type: array
              description: Every goal, to choose another.
              items:
                type: object
                required: [id, name]
                properties:
                  id:
                    type: string
                  name:
                    type: string
            landings_from:
              type: string
              description: Oldest day whose visits from search are counted (YYYY-MM-DD); empty before the first summary.
            partial:
              type: boolean
              description: Whether some days of the period or comparison are still to be filled in.
            totals:
              $ref: '#/components/schemas/ContentMetrics'
            rows:
              type: array
              items:
                $ref: '#/components/schemas/ContentRow'
            total:
              type: integer
              description: All pages with search clicks or visits from search.
            more:
              type: boolean
              description: Whether there are more rows after these.
            compare:
              type: object
              required: [range, totals, change]
              properties:
                range:
                  $ref: '#/components/schemas/Range'
                totals:
                  $ref: '#/components/schemas/ContentMetrics'
                change:
                  $ref: '#/components/schemas/ContentChange'

    DemoStatus:
      type: object
      required: [status, days, progress, from, made, viewing]
      properties:
        status:
          type: string
          enum: [none, making, ready]
        days:
          type: integer
          description: Days of visits asked for.
        progress:
          type: number
          description: 0 to 1.
        from:
          type: [string, 'null']
          format: date-time
          description: Start of the first demo day.
        made:
          type: [string, 'null']
          format: date-time
          description: When it was ready.
        viewing:
          type: string
          enum: [live, demo]
          description: The data set the signed-in person chose to see.

    Connection:
      type: object
      description: |
        An outside data source's status, without credentials. Fields after
        `connected` are there only while it is connected. Days are the
        source's own (Search Console: Pacific time; Bing: UTC).
      required: [source, name, connected]
      properties:
        source:
          type: string
          enum: [search-console, bing]
        name:
          type: string
        connected:
          type: boolean
        account:
          type: string
          description: The service account's address.
        property:
          type: string
        connected_at:
          type: integer
          description: Unix time.
        imported:
          type: object
          required: [from, to, days, of, complete]
          properties:
            from:
              type: string
              description: First day with data ('' when none).
            to:
              type: string
              description: Last day with data.
            days:
              type: integer
              description: Days the job has been through, of `of`.
            of:
              type: integer
              description: Days in the history the source keeps, back to the property's first search.
            complete:
              type: boolean
        final_through:
          type: string
          description: The newest day the source says is final ('' before the first check).
        checked:
          type: integer
          description: When it was last asked for new final days (Unix time; 0 never).
        last_run:
          type: integer
        next_run:
          type: integer
          description: When the job runs next (Unix time; 0 none).
        error:
          type: string
          description: The last run's error ('' none).
        error_at:
          type: integer
        imports:
          type: array
          description: The last five imports, newest first.
          items:
            $ref: '#/components/schemas/Import'

    Import:
      type: object
      required: [id, source, status, started, finished, from, to, days, rows, error]
      properties:
        id:
          type: integer
        source:
          type: string
        status:
          type: string
          enum: [running, done, failed, undone]
        started:
          type: integer
        finished:
          type: integer
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        days:
          type: integer
        rows:
          type: integer
        error:
          type: string

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            status:
              type: integer
