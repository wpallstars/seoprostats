  /properties:
    get:
      operationId: getProperties
      summary: Property keys sent with events and pages, or one key's values.
      description: |
        Without `key`: the keys, with how often each was sent. With `key`:
        that key's values, and the revenue of the events that carried each
        value (per currency). Sorted by count. Pageview properties count
        unless `event` limits the rows to one event's properties.
      parameters:
        - name: key
          in: query
