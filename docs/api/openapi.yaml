openapi: 3.1.0
info:
  title: SEO Pro Stats API
  version: 0.2.0
  summary: Site statistics for people, dashboards and AI agents.
  description: |
    Read routes of SEO Pro Stats (namespace `seoprostats/v1`). WordPress
    serves them under `/wp-json/seoprostats/v1`. A standalone app serves the
    same routes and answers, so clients work with either.

    Reading needs the `view_seoprostats` capability (people who can manage
    options, by default). Agents and scripts authenticate with an
    Application Password (HTTP Basic); the dashboard uses the logged-in
    cookie and a `wp_rest` nonce.

    Times are ISO 8601 in the site time zone; ranges are half-open
    (`from` inclusive, `to` exclusive). Rates are fractions (0.5 = 50%);
    durations are whole seconds. Metric definitions:
    docs/architecture.md → Reports → Metric definitions.

    Answers are cached for up to five minutes; `generated` says when an
    answer was worked out and `cached` whether it came from the cache.

    Every report reads live statistics, or with `data=demo` the demo data:
    made-up visits in tables of their own, for training, screenshots and
    testing (`/demo` makes and removes it). The two are never mixed; goals
    and funnels belong to a data set too (demo data comes with examples).

    Changing goals and funnels needs the `manage_options` capability.
  license:
    name: GPL-3.0-or-later
    identifier: GPL-3.0-or-later
servers:
  - url: /wp-json/seoprostats/v1
security:
  - applicationPassword: []
  - cookieNonce: []

paths:
  /stats:
    get:
      operationId: getStats
      summary: Headline metrics for a range, with an optional comparison.
      parameters:
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/compare'
        - $ref: '#/components/parameters/filters'
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: Metrics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /timeseries:
    get:
      operationId: getTimeseries
      summary: Metrics per hour, day or month, zero-filled up to now.
      parameters:
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/compare'
        - $ref: '#/components/parameters/filters'
        - name: grain
          in: query
          description: auto picks hours up to two days, days up to 120 days, else months. Hours are refused past 31 days (days instead).
          schema:
            type: string
            enum: [auto, hour, day, month]
            default: auto
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: Points; with a comparison, the earlier period's points in the same order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeseriesAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /breakdown:
    get:
      operationId: getBreakdown
      summary: Top values of a dimension with their metrics.
      description: |
        Visit dimensions answer visit metrics, sorted by visits. `page`
        answers pageviews, average time on page and scroll per page, sorted
        by pageviews. `event` answers events and conversion rate per event
        name, sorted by events. `value` is what a filter on the dimension
        takes; `label` is for display.
      parameters:
        - name: dimension
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Dimension'
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/filters'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: Rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakdownAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /realtime:
    get:
      operationId: getRealtime
      summary: Visitors active in the last 30 minutes. Never cached.
      description: Hits wait up to a minute in the collector's buffer before they count.
      parameters:
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: Now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealtimeAnswer'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /markers:
    get:
      operationId: getMarkers
      summary: Changes to show on the timeline for a range, oldest first.
      description: |
        The change log's entries in the range (at most 1000), for marking
        charts: posts and pages published, unpublished, moved, retitled and
        edited; SEO titles, descriptions, robots and canonicals; prices,
        sales, stock and coupons; plugins, themes and WordPress updated or
        switched; settings that change how search engines see the site;
        search engine updates when switched on, with those that began up to
        60 days before the range and were still rolling out in it; and
        notes. `page` keeps that page's changes and the site-wide ones.
      parameters:
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/changePage'
        - $ref: '#/components/parameters/changeKinds'
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: Markers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkersAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /changes:
    get:
      operationId: getChanges
      summary: The change log for a range, newest first, with paging.
      description: The same entries as markers, newest first. Changes are site facts and are kept for good; no visitor data is involved.
      parameters:
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/changePage'
        - $ref: '#/components/parameters/changeKinds'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: Changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangesAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /annotations:
    post:
      operationId: addAnnotation
      summary: Add a note to the timeline (manage_options).
      description: |
        A note marks something the change log cannot see, such as a
        newsletter sent, a campaign started or an outage, so it shows on
        the charts and in the change log (group note, kind note, source
        note). Optionally about one page; without a time, now.
      parameters:
        - $ref: '#/components/parameters/data'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note:
                  type: string
                  maxLength: 190
                  examples: [Newsletter sent]
                page:
                  type: string
                  description: The page it is about (a path); empty for the whole site.
                  examples: [/pricing/]
                time:
                  type: string
                  description: When, in the site time zone (2026-10-05 or 2026-10-05 14:30), or Unix time; empty for now.
      responses:
        '200':
          description: The note as saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Marker'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /annotations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The note's id (a change id).
        schema:
          type: integer
          minimum: 1
      - $ref: '#/components/parameters/data'
    delete:
      operationId: deleteAnnotation
      summary: Delete a note (manage_options). Recorded changes cannot be deleted.
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /goals:
    get:
      operationId: getGoals
      summary: Every goal with its conversions, conversion rate and revenue.
      description: |
        A goal is a page viewed or an event sent. `visits` are the visits
        that reached it (conversions); `conversion_rate` is visits ÷ all
        visits in the range (with the filters); `completions` counts every
        time it was reached. Revenue comes from the matching events, one
        amount per currency (never added across currencies). Goals keep
        the order they were added in. An exact Purchase event goal subtracts
        Refund amounts on the original visits and purchase dates, without
        counting refunds as conversions or completions. Property revenue for
        Purchase or all events also subtracts refunds; an explicit Refund
        report shows positive returned amounts.
      parameters:
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/compare'
        - $ref: '#/components/parameters/filters'
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: Goals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalsAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'
    post:
      operationId: addGoal
      summary: Add a goal (manage_options). Up to 50 per data set.
      parameters:
        - $ref: '#/components/parameters/data'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalStep'
      responses:
        '200':
          description: The goal as saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '400':
          $ref: '#/components/responses/BadDefinition'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /goals/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/data'
    put:
      operationId: updateGoal
      summary: Change a goal (manage_options). POST and PATCH work too.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalStep'
      responses:
        '200':
          description: The goal as saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '400':
          $ref: '#/components/responses/BadDefinition'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteGoal
      summary: Delete a goal (manage_options). Its statistics stay.
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /funnels:
    get:
      operationId: getFunnels
      summary: Every funnel with the visits at each step and where they left.
      description: |
        A funnel's steps are reached in order within one visit; other
        pages and events may come between them. A visit reaches step k
        when it reached step k−1 and later had step k's page or event.
        `entered` is the visits at step 1, `completed` those at the last
        step. Funnels keep the order they were added in.
      parameters:
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/compare'
        - $ref: '#/components/parameters/filters'
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: Funnels.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FunnelsAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'
    post:
      operationId: addFunnel
      summary: Add a funnel (manage_options). Up to 20 per data set.
      parameters:
        - $ref: '#/components/parameters/data'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FunnelInput'
      responses:
        '200':
          description: The funnel as saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Funnel'
        '400':
          $ref: '#/components/responses/BadDefinition'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /funnels/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/data'
    put:
      operationId: updateFunnel
      summary: Change a funnel (manage_options). POST and PATCH work too.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FunnelInput'
      responses:
        '200':
          description: The funnel as saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Funnel'
        '400':
          $ref: '#/components/responses/BadDefinition'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteFunnel
      summary: Delete a funnel (manage_options). Its statistics stay.
      responses:
        '200':
          $ref: '#/components/responses/Deleted'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /properties:
    get:
      operationId: getProperties
      summary: Property keys sent with events and pages, or one key's values.
      description: |
        Without `key`: the keys, with how often each was sent. With `key`:
        that key's values, and the revenue of the events that carried each
        value (per currency). Sorted by count. Pageview properties count
        unless `event` limits the rows to one event's properties.
      parameters:
        - name: key
          in: query
          schema:
            type: string
            examples: [plan]
        - name: event
          in: query
          schema:
            type: string
            examples: [Purchase]
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/filters'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: Rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertiesAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /clicks:
    get:
      operationId: getClicks
      summary: Clicks and form submits (autocapture), with totals.
      description: |
        Totals of the period, and rows of one `kind`: clicked elements (by
        selector and label, with their dead clicks), dead clicks only, link
        destinations, file links, or forms sent (by name, selector and
        destination), or pages grouped by path with clicks, dead-click rate,
        link clicks, forms sent and visits. Sorted by count. `page` keeps clicks on that page;
        filters select the visits, and a page filter also keeps clicks on
        that page. Clicks are kept 3 months by default (Settings → Data),
        so older ranges are empty. Never carries what anyone typed.
      parameters:
        - name: kind
          in: query
          schema:
            type: string
            enum: [elements, dead, links, downloads, forms, pages]
            default: elements
        - name: page
          in: query
          description: A path; `*` is any text.
          schema:
            type: string
            examples: [/pricing/]
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/compare'
        - $ref: '#/components/parameters/filters'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: Totals and rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClicksAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'
  /search:
    get:
      operationId: getSearch
      summary: Google Search Console clicks, impressions, CTR and position, with rows.
      description: |
        Search data imported from Google Search Console (`/connections`):
        totals of the period, a point per day (per month past 120 days),
        and rows of one `kind`: search queries, pages, countries or
        devices, sorted by clicks. `page` keeps the searches that showed
        that page (its queries), `query` keeps one query (its pages);
        countries and devices exist for the whole site only, so with
        either they are empty.

        Search days are the engine's own (Pacific time for Google) and
        final only, so the newest is about three days old. The period is
        cut at the newest day with search data (`through`), and the
        comparison has the same number of days, so days not imported yet
        never look like a drop. Page filters apply like `page`; other
        filters select visits, which search data has not, and are listed
        in `ignored`.

        CTR is clicks ÷ impressions. Position is the average of the
        highest place a page held each time it was shown, weighted by
        impressions; lower is better, and 0 means no impressions.
        Search Console leaves out rare searches, so rows add up to less
        than the totals. Demo data has made-up search days.
      parameters:
        - name: kind
          in: query
          schema:
            type: string
            enum: [queries, pages, countries, devices]
            default: queries
        - name: page
          in: query
          description: A path; `*` is any text.
          schema:
            type: string
            examples: [/pricing/]
        - name: query
          in: query
          description: A search query; `*` is any text.
          schema:
            type: string
            examples: [core web vitals]
        - $ref: '#/components/parameters/range'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/compare'
        - $ref: '#/components/parameters/filters'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - $ref: '#/components/parameters/data'
      responses:
        '200':
          description: Totals, points and rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchAnswer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoDemo'

  /demo:
    get:
      operationId: getDemo
      summary: Whether the demo data is made, and which data set the signed-in person sees.
      responses:
        '200':
          description: Status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoStatus'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: makeDemo
      summary: Make the demo data, or carry on making it.
      description: |
        Needs manage_options. Starts when there is no demo data (or with
        `restart`), then each call does up to ten seconds of work: call
        again until `status` is `ready`. Live statistics are not touched.
        While it is shown, demo data is topped up to the present, so today
        and realtime have visits.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                days:
                  type: integer
                  minimum: 1
                  maximum: 800
                  default: 400
                  description: Days of visits back from today.
                restart:
                  type: boolean
                  default: false
                  description: Remove the demo data and make it again.
      responses:
        '200':
          description: Status after this slice of work.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoStatus'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      operationId: removeDemo
      summary: Remove the demo data (its tables). Needs manage_options; live statistics are not touched.
      responses:
        '200':
          description: Status (none).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoStatus'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'

  /view:
    post:
      operationId: setView
      summary: Save the data set the signed-in person sees on the screens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: string
                  enum: [live, demo]
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: string
                    enum: [live, demo]
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'

  /connections:
    get:
      operationId: listConnections
      summary: Every outside data source's status. Needs the right to change the settings; never returns credentials.
      responses:
        '200':
          description: Statuses.
          content:
            application/json:
              schema:
                type: object
                required: [sources]
                properties:
                  sources:
                    type: array
                    items:
                      $ref: '#/components/schemas/Connection'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'

  /connections/{source}:
    parameters:
      - $ref: '#/components/parameters/source'
    get:
      operationId: getConnection
      summary: One source's status.
      responses:
        '200':
          description: Status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UnknownSource'
    post:
      operationId: connect
      summary: Connect a source, or change its property or key.
      description: |
        Search Console: signs in with the service account's key and lists
        the properties it can read before anything is stored. The key is
        stored encrypted and never returned. The import starts in WP-Cron a
        few seconds later: the 16 months Search Console keeps, newest
        first, then each day once Search Console marks it final. Another
        property starts the import again from the beginning.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                  description: The service account's JSON key, as text. Without it, the saved key is kept (to change the property).
                property:
                  type: string
                  description: The property to import. Without it, the one for this site's address (a domain property before an address one).
                  examples: ['sc-domain:example.com', 'https://example.com/']
      responses:
        '200':
          description: Connected; its status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '400':
          description: |
            The key cannot be read, Google refused the sign-in, or the
            service account cannot read the property. When a property is the
            problem, `data.properties` lists the ones it can read and
            `data.account` is its address, to add in Search Console.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UnknownSource'
    delete:
      operationId: disconnect
      summary: Disconnect a source (forget its credentials); its imported data stays unless delete_data is true.
      parameters:
        - name: delete_data
          in: query
          description: Also delete the data imported from it, and its import history.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Disconnected; its status, with the rows deleted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Connection'
                  - type: object
                    required: [deleted]
                    properties:
                      deleted:
                        type: integer
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UnknownSource'

  /connections/{source}/import:
    parameters:
      - $ref: '#/components/parameters/source'
    post:
      operationId: importNow
      summary: Import now, for up to 20 seconds; while history remains, the job carries on in WP-Cron a minute apart.
      responses:
        '200':
          description: What this run did, and the status after it.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Connection'
                  - type: object
                    required: [run]
                    properties:
                      run:
                        type: object
                        required: [days, rows, import, done]
                        properties:
                          days:
                            type: integer
                          rows:
                            type: integer
                          import:
                            type: integer
                            description: The imports row it wrote (0 when there was nothing new).
                          done:
                            type: boolean
                            description: Every final day is in.
        '400':
          description: The source is not connected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UnknownSource'
        '409':
          description: Another import is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: The source answered with an error (the message is its own); the job tries again later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /imports/{id}:
    delete:
      operationId: undoImport
      summary: Undo an import, deleting the rows it wrote.
      description: |
        The job does not import those days again; `wp seoprostats
        search-console reimport --from=… --to=…` does. Undoing an import
        already undone deletes nothing.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Undone.
          content:
            application/json:
              schema:
                type: object
                required: [id, deleted]
                properties:
                  id:
                    type: integer
                  deleted:
                    type: integer
                    description: Rows deleted.
        '401':
          $ref: '#/components/responses/Forbidden'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: There is no import with that ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    applicationPassword:
      type: http
      scheme: basic
      description: WordPress username and an Application Password.
    cookieNonce:
      type: apiKey
      in: header
      name: X-WP-Nonce
      description: The logged-in cookie with a wp_rest nonce (the dashboard).

  parameters:
    range:
      name: range
      in: query
      description: |
        Period in the site time zone. realtime: the last 30 minutes. 24h:
        the last 24 whole hours and the current one. 7d, 30d, 90d: that many
        days including today. week (from the site's first day of the week),
        month, year: so far. 12mo: a year back from tomorrow. lastyear: the
        previous calendar year. all: since the first visit. custom: from and
        to.
      schema:
        type: string
        enum: [realtime, today, yesterday, 24h, 7d, 30d, 90d, week, month, year, 12mo, lastyear, all, custom]
        default: 7d
    from:
      name: from
      in: query
      description: First day of a custom range.
      schema:
        type: string
        format: date
    to:
      name: to
      in: query
      description: Last day of a custom range (included).
      schema:
        type: string
        format: date
    compare:
      name: compare
      in: query
      description: |
        prev: the same number of days just before (24h and realtime: the
        same length). year: the same dates a year before. A range that ends
        in the future is compared with the same length of the other period,
        so a partial day meets a partial day.
      schema:
        type: string
        enum: [none, prev, year]
        default: none
    filters:
      name: filters
      in: query
      description: |
        Every filter must match (AND). Each is
        `dimension:operator:value`, where a comma means any of (OR) and `\,`
        is a comma in a value; `dimension:value` means `is`. Repeat the
        parameter as `filters[]=` for several, or send a JSON list of
        `{dimension, op, values}`. Operators: is, is_not, contains (anywhere,
        case-insensitive per the database collation), matches (glob: `*` is
        any text). An empty value is "none" (for source: direct). Channel
        and device take their names (organic_search, mobile); country takes
        ISO codes. Page and event filters select visits that viewed the
        page or had the event; with a page filter, pageviews count only
        that page's views.
      style: form
      explode: true
      schema:
        oneOf:
          - type: string
            examples: ['channel:is:organic_search,ai']
          - type: array
            items:
              type: string
            examples: [['page:matches:/blog/*', 'country:is_not:US']]
    data:
      name: data
      in: query
      description: live (the site's statistics) or demo (the demo data, once made).
      schema:
        type: string
        enum: [live, demo]
        default: live
    changePage:
      name: page
      in: query
      description: Only changes to this page (a path; `*` is any text), and the site-wide ones (plugins, themes, settings), which affect every page.
      schema:
        type: string
        examples: [/pricing/]
    changeKinds:
      name: kinds
      in: query
      description: |
        Only these kinds or groups of change, comma-separated. Groups:
        content, seo, product, site, search, note. Kinds: published,
        unpublished, address, title, content, links, external_links;
        seo_title, meta_description, robots, canonical; out_of_stock,
        back_in_stock, price_up, price_down, sale_started, sale_ended,
        coupon_published, coupon_changed, coupon_removed; plugin_installed,
        plugin_updated, plugin_activated, plugin_deactivated,
        plugin_deleted, theme_switched, theme_updated, core_updated,
        search_visibility, permalinks, site_address, front_page;
        search_update (search engine updates, when switched on under
        Settings → Data); note.
      schema:
        type: string
        examples: [product, 'plugin_updated,core_updated', search]
    id:
      name: id
      in: path
      required: true
      description: A goal's or funnel's id (lower-case letters and digits).
      schema:
        type: string
        pattern: '^[a-z0-9]+$'
    source:
      name: source
      in: path
      required: true
      description: An outside data source.
      schema:
        type: string
        enum: [search-console]

  responses:
    BadDefinition:
      description: A field is missing or too long, a funnel has too few or too many steps, or the data set already has the most goals or funnels it may.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: There is no such goal, funnel or note in this data set (or, with data=demo, no demo data).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Deleted:
      description: Deleted.
      content:
        application/json:
          schema:
            type: object
            required: [deleted, id]
            properties:
              deleted:
                type: boolean
              id:
                type: [string, integer]
                description: A goal's or funnel's id (a string), or a note's (an integer).
    NoDemo:
      description: data=demo, and there is no demo data yet (POST /demo makes it).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: A parameter cannot be read; the message says how to write it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Not logged in, or without view_seoprostats.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnknownSource:
      description: There is no such data source.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Dimension:
      type: string
      enum: [channel, source, utm_source, utm_medium, utm_campaign, utm_term, utm_content, country, device, browser, os, language, login, entry, exit, page, not_found, search, no_results, author, category, post_type, event]
      description: |
        channel: direct, organic_search, paid_search, ai, organic_social,
        paid_social, email, referral, paid_other. source: referring host.
        device: desktop, mobile, tablet, unknown. login: logged_in,
        logged_out (visits recorded before logins were counted are
        logged_out). entry, exit:
        first and last page of a visit. page: any page viewed. not_found:
        a page that answered 404. search: the words of a site search (''
        when not recorded); no_results: searches that found nothing.
        author, category, post_type: what a viewed post, page or other
        single item is; values are user IDs, term IDs and post type names,
        and a filter also takes the name. Pageview dimensions count views
        (pageviews); not_found, search, no_results, author, category and
        post_type are read from the visits, not the daily summaries.
        event: event name.

    Range:
      type: object
      required: [key, from, to, timezone]
      properties:
        key:
          type: string
          description: The range, or prev/year for a comparison range.
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        timezone:
          type: string
          examples: [Europe/London]

    Metrics:
      type: object
      required: [visitors, visits, pageviews, views_per_visit, bounce_rate, visit_duration, events]
      properties:
        visitors:
          type: integer
          description: Distinct visitors per day, summed over the days (no identity crosses days).
        visits:
          type: integer
        pageviews:
          type: integer
        views_per_visit:
          type: number
        bounce_rate:
          type: number
          description: Visits with one pageview and no event, as a fraction of visits.
        visit_duration:
          type: integer
          description: Average visible time per visit, in seconds.
        events:
          type: integer

    Change:
      type: object
      description: (now − then) ÷ then for each metric; null when then is 0.
      additionalProperties:
        type: [number, 'null']

    Answer:
      type: object
      properties:
        generated:
          type: string
          format: date-time
        cached:
          type: boolean

    StatsAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [range, metrics]
          properties:
            range:
              $ref: '#/components/schemas/Range'
            metrics:
              $ref: '#/components/schemas/Metrics'
            compare:
              type: object
              required: [range, metrics, change]
              properties:
                range:
                  $ref: '#/components/schemas/Range'
                metrics:
                  $ref: '#/components/schemas/Metrics'
                change:
                  $ref: '#/components/schemas/Change'

    Point:
      allOf:
        - type: object
          required: [t]
          properties:
            t:
              type: string
              format: date-time
              description: Start of the hour, day or month.
        - $ref: '#/components/schemas/Metrics'

    TimeseriesAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [range, grain, points]
          properties:
            range:
              $ref: '#/components/schemas/Range'
            grain:
              type: string
              enum: [hour, day, month]
            points:
              type: array
              items:
                $ref: '#/components/schemas/Point'
            compare:
              type: object
              required: [range, points]
              properties:
                range:
                  $ref: '#/components/schemas/Range'
                points:
                  type: array
                  items:
                    $ref: '#/components/schemas/Point'

    BreakdownRow:
      type: object
      required: [value, label, visitors, visits, share]
      properties:
        value:
          type: string
          description: What a filter on this dimension takes ('' for none).
        label:
          type: string
        visitors:
          type: integer
        visits:
          type: integer
        share:
          type: number
          description: This row's visits as a fraction of all visits in the range.
        pageviews:
          type: integer
        views_per_visit:
          type: number
        bounce_rate:
          type: number
        visit_duration:
          type: integer
        events:
          type: integer
        time_on_page:
          type: integer
          description: page only. Average visible seconds per view.
        scroll:
          type: integer
          description: page only. Average deepest scroll, percent.
        conversion_rate:
          type: number
          description: event only. Visits with the event as a fraction of all visits.

    BreakdownAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [range, dimension, total, rows]
          properties:
            range:
              $ref: '#/components/schemas/Range'
            dimension:
              $ref: '#/components/schemas/Dimension'
            total:
              $ref: '#/components/schemas/Metrics'
            rows:
              type: array
              items:
                $ref: '#/components/schemas/BreakdownRow'

    Count:
      type: object
      required: [value, label, count]
      properties:
        value:
          type: string
        label:
          type: string
        count:
          type: integer

    RealtimeAnswer:
      type: object
      required: [visitors, pageviews, per_minute, pages, sources, processed, generated]
      properties:
        visitors:
          type: integer
          description: Distinct visitors with a hit in the last 30 minutes.
        pageviews:
          type: integer
        per_minute:
          type: array
          description: Pageviews per minute, oldest first (30 values).
          items:
            type: integer
        pages:
          type: array
          items:
            $ref: '#/components/schemas/Count'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Count'
        processed:
          type: [string, 'null']
          format: date-time
          description: When hits were last processed.
        generated:
          type: string
          format: date-time

    Marker:
      description: One change to the site (an entry of the change log).
      type: object
      required: [id, t, kind, group, label, title, path, old, new, object, meta, source, user]
      properties:
        id:
          type: integer
        t:
          type: string
          format: date-time
          description: When it changed, in the site time zone.
        kind:
          type: string
          description: What changed (the kinds parameter lists them).
        group:
          type: string
          enum: [content, seo, product, site, search, note]
        label:
          type: string
          description: One line saying what changed, in the site's language.
        title:
          type: string
          description: The post, product, coupon, plugin, theme or setting, by name when it changed.
        path:
          type: [string, 'null']
          description: The page it affects; null for site-wide changes.
        old:
          type: string
          description: Value before (a path, title, word count, price, version or setting); empty when there was none. For search_update, its type (core, spam, link_spam, helpful_content, reviews, product_reviews, site_reputation, discover, ranking, crawling, indexing, serving or announcement).
        new:
          type: string
          description: Value after. For search_update, its id at the source.
        object:
          type: object
          required: [type, id]
          properties:
            type:
              type: string
              description: The post type, or coupon, plugin, theme, core, option; for search_update the engine (google, or a key from the feed's name).
            id:
              type: integer
        meta:
          type: object
          description: |
            Details by kind: name; content: before, after, added, removed
            (words); links: added, removed, changed (each to and text);
            external_links: gained, lost (hosts); prices: currency, field
            (regular, sale or price); plugins: file; coupons: fields
            changed (old and new); search_update: name, engine (to show),
            url (at the source), ended (ISO 8601; empty while rolling out;
            only for updates that roll out over a span), feed (other feeds).
          additionalProperties: true
        source:
          type: string
          enum: [wordpress, cli, api, cron, feed, note]
          description: Where the change was made.
        user:
          type: [string, 'null']
          description: Who made it (display name), for people who may list users; else null.

    MarkersAnswer:
      type: object
      required: [range, markers, total]
      properties:
        range:
          $ref: '#/components/schemas/Range'
        markers:
          type: array
          items:
            $ref: '#/components/schemas/Marker'
        total:
          type: integer
          description: Changes in the range that match.

    ChangesAnswer:
      type: object
      required: [range, changes, total, limit, offset]
      properties:
        range:
          $ref: '#/components/schemas/Range'
        changes:
          type: array
          items:
            $ref: '#/components/schemas/Marker'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    GoalStep:
      type: object
      required: [kind, match]
      properties:
        name:
          type: string
          maxLength: 100
          description: Shown in reports. A goal without one is named after its match.
        kind:
          type: string
          enum: [page, event]
          description: page — a page viewed; event — an event sent.
        match:
          type: string
          maxLength: 300
          description: The path (/pricing/) or event name (Purchase); `*` is any text (/blog/*).

    Goal:
      allOf:
        - type: object
          required: [id, name]
          properties:
            id:
              type: string
        - $ref: '#/components/schemas/GoalStep'

    FunnelInput:
      type: object
      required: [name, steps]
      properties:
        name:
          type: string
          maxLength: 100
        steps:
          type: array
          minItems: 2
          maxItems: 12
          description: In the order they are reached within one visit. Step names may be empty.
          items:
            $ref: '#/components/schemas/GoalStep'

    Funnel:
      allOf:
        - type: object
          required: [id]
          properties:
            id:
              type: string
        - $ref: '#/components/schemas/FunnelInput'

    Revenue:
      type: object
      required: [currency, amount, count]
      description: Revenue in one currency; amounts in different currencies are never added.
      properties:
        currency:
          type: string
          description: ISO 4217 code.
          examples: [USD]
        amount:
          type: number
          description: In the currency's main unit (dollars, not cents).
        count:
          type: integer
          description: Events that carried revenue in this currency.

    GoalRow:
      allOf:
        - $ref: '#/components/schemas/Goal'
        - type: object
          required: [visitors, visits, completions, conversion_rate, revenue]
          properties:
            visitors:
              type: integer
            visits:
              type: integer
              description: Visits that reached the goal (conversions).
            completions:
              type: integer
              description: Times it was reached (pageviews or events).
            conversion_rate:
              type: number
              description: visits ÷ all visits in the range.
            revenue:
              type: array
              items:
                $ref: '#/components/schemas/Revenue'
            change:
              $ref: '#/components/schemas/Change'

    GoalsAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [range, visits, goals]
          properties:
            range:
              $ref: '#/components/schemas/Range'
            visits:
              type: integer
              description: All visits in the range (with the filters).
            goals:
              type: array
              items:
                $ref: '#/components/schemas/GoalRow'
            compare:
              type: object
              description: The comparison period's answer; each goal row then has `change` (visits, completions, conversion_rate).
              properties:
                range:
                  $ref: '#/components/schemas/Range'
                visits:
                  type: integer
                goals:
                  type: array
                  items:
                    $ref: '#/components/schemas/GoalRow'

    FunnelStepRow:
      allOf:
        - $ref: '#/components/schemas/GoalStep'
        - type: object
          required: [visits, rate, step_rate, dropped]
          properties:
            visits:
              type: integer
              description: Visits that reached this step in order.
            rate:
              type: number
              description: Of the visits that entered the funnel.
            step_rate:
              type: number
              description: Of the visits at the step before.
            dropped:
              type: integer
              description: Visits at the step before that did not reach this one.

    FunnelRow:
      type: object
      required: [id, name, entered, completed, completion_rate, conversion_rate, steps]
      properties:
        id:
          type: string
        name:
          type: string
        entered:
          type: integer
        completed:
          type: integer
        completion_rate:
          type: number
          description: completed ÷ entered.
        conversion_rate:
          type: number
          description: completed ÷ all visits in the range.
        steps:
          type: array
          items:
            $ref: '#/components/schemas/FunnelStepRow'
        change:
          $ref: '#/components/schemas/Change'

    FunnelsAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [range, visits, funnels]
          properties:
            range:
              $ref: '#/components/schemas/Range'
            visits:
              type: integer
            funnels:
              type: array
              items:
                $ref: '#/components/schemas/FunnelRow'
            compare:
              type: object
              description: The comparison period's answer; each funnel row then has `change` (entered, completed, conversion_rate).
              properties:
                range:
                  $ref: '#/components/schemas/Range'
                visits:
                  type: integer
                funnels:
                  type: array
                  items:
                    $ref: '#/components/schemas/FunnelRow'

    PropertyRow:
      type: object
      required: [value, label, count, visits, share, revenue]
      properties:
        value:
          type: string
          description: The key (without `key`) or the value.
        label:
          type: string
        count:
          type: integer
          description: Times it was sent.
        visits:
          type: integer
        share:
          type: number
          description: visits ÷ all visits in the range.
        revenue:
          type: array
          description: With `key` only.
          items:
            $ref: '#/components/schemas/Revenue'

    PropertiesAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [range, key, event, visits, rows]
          properties:
            range:
              $ref: '#/components/schemas/Range'
            key:
              type: string
            event:
              type: string
            visits:
              type: integer
            rows:
              type: array
              items:
                $ref: '#/components/schemas/PropertyRow'

    ClickTotals:
      type: object
      required: [clicks, dead, dead_rate, links, outbound, affiliate, downloads, forms, visits]
      properties:
        clicks:
          type: integer
          description: Clicks (form submits are counted apart).
        dead:
          type: integer
          description: Clicks the page did not react to within a second.
        dead_rate:
          type: number
          description: dead ÷ clicks.
        links:
          type: integer
          description: Clicks with a destination (links, here or elsewhere).
        outbound:
          type: integer
        affiliate:
          type: integer
        downloads:
          type: integer
          description: Clicks on file links.
        forms:
          type: integer
          description: Forms sent.
        visits:
          type: integer
          description: Visits with a click or form submit.

    ClickRow:
      type: object
      required: [selector, label, target, count, visits, share, dead, dead_rate, outbound, affiliate, download, fields]
      properties:
        selector:
          type: string
          description: tag#id.class of the element or form.
          examples: [a.wp-block-button__link]
        label:
          type: string
          description: Its text, or a form's name; emails and long numbers masked; '' when hidden with data-sps-mask.
        target:
          type: string
          description: "Destination; a path here, origin and path elsewhere, or mailto:/tel: without the address."
        count:
          type: integer
        visits:
          type: integer
        share:
          type: number
          description: count ÷ all clicks (forms ÷ all forms sent).
        dead:
          type: integer
        dead_rate:
          type: number
        outbound:
          type: boolean
        affiliate:
          type: boolean
        download:
          type: boolean
        fields:
          type: integer
          description: A form's fields (never their values); 0 for clicks.
        path:
          type: string
          description: Pages rows only; the page where clicks happened.
        url:
          type: string
          description: Pages rows only; address on this site.
        post_id:
          type: integer
          description: Pages rows only; 0 when no post matches.
        edit_url:
          type: [string, 'null']
          description: Pages rows only; null without edit_post permission. Shared read-only views omit it.
        links:
          type: integer
          description: Pages rows only; link clicks on the page.
        forms:
          type: integer
          description: Pages rows only; forms sent on the page.

    ClickPageInfo:
      type: [object, 'null']
      description: Exact local page only; null for an empty page or a wildcard. Post identity is resolved inside the report cache, edit permission checked on every request. Shared read-only views must omit edit_url.
      required: [path, url, post_id]
      properties:
        path:
          type: string
        url:
          type: string
        post_id:
          type: integer
          description: 0 when no post matches, including made-up demo paths.
        edit_url:
          type: [string, 'null']
          description: Editor address only when the current user can edit the post; otherwise null.

    ClicksAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [range, kind, page, page_info, totals, rows]
          properties:
            range:
              $ref: '#/components/schemas/Range'
            kind:
              type: string
              enum: [elements, dead, links, downloads, forms, pages]
            page:
              type: string
            page_info:
              $ref: '#/components/schemas/ClickPageInfo'
            totals:
              $ref: '#/components/schemas/ClickTotals'
            rows:
              type: array
              items:
                $ref: '#/components/schemas/ClickRow'
            compare:
              type: object
              required: [range, totals, change]
              properties:
                range:
                  $ref: '#/components/schemas/Range'
                totals:
                  $ref: '#/components/schemas/ClickTotals'
                change:
                  type: object
                  description: (now − then) ÷ then per total; null when then is 0.
                  additionalProperties:
                    type: [number, 'null']

    SearchMetrics:
      type: object
      required: [clicks, impressions, ctr, position]
      properties:
        clicks:
          type: integer
        impressions:
          type: integer
        ctr:
          type: number
          description: clicks ÷ impressions.
        position:
          type: number
          description: Average position weighted by impressions; lower is better; 0 without impressions.

    SearchChange:
      type: object
      description: (now − then) ÷ then for clicks, impressions and CTR (null when then is 0); for position, now − then in places (negative is a climb; null when either has no impressions).
      required: [clicks, impressions, ctr, position]
      properties:
        clicks:
          type: [number, 'null']
        impressions:
          type: [number, 'null']
        ctr:
          type: [number, 'null']
        position:
          type: [number, 'null']

    SearchPoint:
      allOf:
        - $ref: '#/components/schemas/SearchMetrics'
        - type: object
          required: [t]
          properties:
            t:
              type: string
              format: date-time
              description: Start of the day or month.

    SearchRow:
      allOf:
        - $ref: '#/components/schemas/SearchMetrics'
        - type: object
          required: [id, value, label, share]
          properties:
            id:
              type: string
              description: Query or page ID, country code (ISO 3166-1 alpha-3, as Search Console gives it) or device code.
            value:
              type: string
              description: The query, the page path, the country (ISO 3166-1 alpha-2; empty when unknown) or the device (desktop, mobile, tablet, unknown).
            label:
              type: string
            share:
              type: number
              description: clicks ÷ all clicks of the period.
            path:
              type: string
              description: Pages rows only.
            url:
              type: string
              description: Pages rows only.
            post_id:
              type: integer
              description: Pages rows only; 0 when no post matches.
            edit_url:
              type: [string, 'null']
              description: Pages rows only; only when the current user can edit the post.
            compare:
              description: With a comparison.
              allOf:
                - $ref: '#/components/schemas/SearchMetrics'
                - type: object
                  required: [change]
                  properties:
                    change:
                      $ref: '#/components/schemas/SearchChange'

    SearchAnswer:
      allOf:
        - $ref: '#/components/schemas/Answer'
        - type: object
          required: [range, through, first, connected, kind, page, query, page_info, ignored, totals, grain, points, rows, more]
          properties:
            range:
              $ref: '#/components/schemas/Range'
            through:
              type: string
              description: Newest day with search data (YYYY-MM-DD); empty with none.
            first:
              type: string
              description: Oldest day with search data (YYYY-MM-DD); empty with none.
            connected:
              type: boolean
              description: Whether Search Console is connected (demo data, always).
            kind:
              type: string
              enum: [queries, pages, countries, devices]
            page:
              type: string
            query:
              type: string
            page_info:
              $ref: '#/components/schemas/ClickPageInfo'
            ignored:
              type: array
              description: Filter dimensions left out (only page filters apply to search data).
              items:
                type: string
            totals:
              $ref: '#/components/schemas/SearchMetrics'
            grain:
              type: string
              enum: [day, month]
            points:
              type: array
              items:
                $ref: '#/components/schemas/SearchPoint'
            rows:
              type: array
              items:
                $ref: '#/components/schemas/SearchRow'
            more:
              type: boolean
              description: Whether there are more rows after these.
            compare:
              type: object
              required: [range, totals, change, points]
              properties:
                range:
                  $ref: '#/components/schemas/Range'
                totals:
                  $ref: '#/components/schemas/SearchMetrics'
                change:
                  $ref: '#/components/schemas/SearchChange'
                points:
                  type: array
                  items:
                    $ref: '#/components/schemas/SearchPoint'

    DemoStatus:
      type: object
      required: [status, days, progress, from, made, viewing]
      properties:
        status:
          type: string
          enum: [none, making, ready]
        days:
          type: integer
          description: Days of visits asked for.
        progress:
          type: number
          description: 0 to 1.
        from:
          type: [string, 'null']
          format: date-time
          description: Start of the first demo day.
        made:
          type: [string, 'null']
          format: date-time
          description: When it was ready.
        viewing:
          type: string
          enum: [live, demo]
          description: The data set the signed-in person chose to see.

    Connection:
      type: object
      description: |
        An outside data source's status, without credentials. Fields after
        `connected` are there only while it is connected. Days are the
        source's own (Search Console: Pacific time).
      required: [source, name, connected]
      properties:
        source:
          type: string
          enum: [search-console]
        name:
          type: string
        connected:
          type: boolean
        account:
          type: string
          description: The service account's address.
        property:
          type: string
        connected_at:
          type: integer
          description: Unix time.
        imported:
          type: object
          required: [from, to, days, of, complete]
          properties:
            from:
              type: string
              description: First day with data ('' when none).
            to:
              type: string
              description: Last day with data.
            days:
              type: integer
              description: Days the job has been through, of `of`.
            of:
              type: integer
              description: Days in the history the source keeps, back to the property's first search.
            complete:
              type: boolean
        final_through:
          type: string
          description: The newest day the source says is final ('' before the first check).
        checked:
          type: integer
          description: When it was last asked for new final days (Unix time; 0 never).
        last_run:
          type: integer
        next_run:
          type: integer
          description: When the job runs next (Unix time; 0 none).
        error:
          type: string
          description: The last run's error ('' none).
        error_at:
          type: integer
        imports:
          type: array
          description: The last five imports, newest first.
          items:
            $ref: '#/components/schemas/Import'

    Import:
      type: object
      required: [id, source, status, started, finished, from, to, days, rows, error]
      properties:
        id:
          type: integer
        source:
          type: string
        status:
          type: string
          enum: [running, done, failed, undone]
        started:
          type: integer
        finished:
          type: integer
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        days:
          type: integer
        rows:
          type: integer
        error:
          type: string

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            status:
              type: integer
